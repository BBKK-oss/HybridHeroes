<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A0B2E">
<title>Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--indigo:#F6F2FB;--ink:#EEE8F6;--violet:#F5B83D;--violet2:#FCE7B2;--teal:#FFD27A;--amber:#FDBA74;--coral:#F87171;--blue:#F28C28;--muted:#B3A5C9;--bg:#22103A;--card:#2A1548;--line:#5B3F86;--night:#1A0B2E}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(900px 500px at 0% -10%,#F5B83D2E,transparent),radial-gradient(800px 500px at 110% 0%,#F28C2833,transparent),radial-gradient(700px 500px at 50% 120%,#F28C2822,transparent),var(--night);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);z-index:0}
#app{position:relative;z-index:1}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 100px}
.wide{max-width:1200px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:.2em 0 .3em;color:#fff}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:.3em 0 .5em;color:#fff}
h3{font-size:18px;font-weight:700;margin:.2em 0 .5em;color:#fff}
p{line-height:1.55}
a{color:var(--violet)}
.card{background:linear-gradient(180deg,#30185Aee,#25123Fee);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 20px 40px #0008;backdrop-filter:blur(10px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2C1650 0%,#3B1C6B 55%,#4C2489 100%);color:#fff;border-radius:24px;padding:22px;border:1px solid #ffffff1f;box-shadow:0 0 0 1px #F5B83D22,0 20px 50px #F5B83D22,inset 0 1px 0 #ffffff22}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#F5B83D55,transparent 70%);pointer-events:none}
.hero p{color:#EAE2F4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#F5B83D,#F28C28);color:#1A0B2E;margin:6px 6px 6px 0;box-shadow:0 0 22px #F5B83D55;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 32px #F5B83D88}.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#ffffff0d;color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn.teal{background:linear-gradient(135deg,#FFD27A,#F5B83D);box-shadow:0 0 22px #FFD27A55}
.btn.coral{background:linear-gradient(135deg,#F87171,#DC2626);color:#fff;box-shadow:0 0 22px #F8717155}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;border-radius:12px;border:1.5px solid var(--line);background:#211036;color:#fff;padding:12px 13px;width:100%;outline:none}
input::placeholder{color:#8F7DAB}
input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #F5B83D33}
label{font-weight:700;font-size:14px;display:block;margin:14px 0 6px;color:var(--violet2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:#ffffff0f;border:1px solid var(--line);color:#fff}
.chip.dark{background:#ffffff1a;color:#fff;border-color:#ffffff2a}
.brand{font-weight:700;font-size:14px;letter-spacing:.18em;background:linear-gradient(90deg,#6D28D9,#F5B83D,#F28C28);-webkit-background-clip:text;background-clip:text;color:transparent}
.chapter{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;margin:10px 0;cursor:pointer;border:1px solid var(--line);width:100%;text-align:left;font:inherit;color:var(--ink);background:linear-gradient(180deg,#2E1752,#22103A);transition:transform .12s,border-color .12s,box-shadow .12s}
.chapter:hover{transform:translateY(-2px);border-color:#F5B83D88;box-shadow:0 0 24px #F5B83D33}
.chapter .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.chapter .t{font-weight:700;font-size:16px;color:#fff}
.chapter .s{font-size:13px;color:var(--muted);margin-top:2px}
.chapter .pts{margin-left:auto;font-weight:700;font-size:13px;white-space:nowrap;text-align:right;color:var(--muted)}
.chapter.locked{opacity:.55}
.chapter.done{border-color:#FFD27A66}.chapter.done .pts{color:var(--teal)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#2C1650;color:var(--ink);border-radius:14px;padding:14px;margin:10px 0;font:inherit;font-size:16px;cursor:pointer;transition:all .15s;line-height:1.45}
.opt:hover{border-color:var(--violet);box-shadow:0 0 18px #F5B83D33;transform:translateX(2px)}
.opt .k{width:28px;height:28px;border-radius:8px;background:#F5B83D1f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--violet)}
.opt.right{border-color:var(--teal);background:#FFD27A14;box-shadow:0 0 18px #FFD27A33}.opt.right .k{background:var(--teal);color:#1A0B2E}
.opt.wrong{border-color:var(--coral);background:#F8717114}.opt.wrong .k{background:var(--coral);color:#fff}
.opt.gone{opacity:.25;pointer-events:none}
.scene{display:flex;gap:12px;align-items:flex-start}
.face{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#F5B83D33,#F28C2833);border:1px solid #ffffff1f;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.scene .who{font-size:13px;font-weight:700;color:var(--violet)}
.scene .txt{font-size:17px;line-height:1.5;margin-top:2px}
.ask{font-weight:700;font-size:17px;margin:14px 0 4px;color:#fff}
.sheet{border-radius:16px;padding:14px 16px;margin-top:12px;animation:rise .3s ease}
.sheet.ok{background:#FFD27A12;border:1.5px solid #FFD27A66}.sheet.no{background:#FDBA7410;border:1.5px solid #FDBA7466}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bar{height:10px;border-radius:99px;background:#ffffff12;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#6D28D9,#F5B83D,#F28C28);box-shadow:0 0 12px #F5B83D88;transition:width .5s}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#FFB347;text-shadow:0 0 12px #FFB34788}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-weight:700;font-size:28px;color:var(--teal);pointer-events:none;animation:pop 1s forwards;z-index:60;text-shadow:0 0 18px #FFD27A}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{transform:translate(-50%,-70px);opacity:0}}
.big{font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,#fff,#FCE7B2);-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;background:#1A0B2E;color:var(--violet);border:1px solid #F5B83D66;box-shadow:0 0 22px #F5B83D33,inset 0 0 18px #F5B83D22;border-radius:14px;padding:16px;text-align:center;margin:10px 0;letter-spacing:.08em;text-shadow:0 0 10px #F5B83D}
.center{text-align:center}.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avatar{font-size:28px;border:1.5px solid var(--line);border-radius:14px;background:#2C1650;width:56px;height:56px;cursor:pointer;transition:all .15s}
.avatar.on{border-color:var(--violet);background:#F5B83D1f;box-shadow:0 0 18px #F5B83D55;transform:scale(1.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2C1650;border:1px solid #F5B83D66;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;box-shadow:0 0 30px #F5B83D44;max-width:92vw;text-align:center}
.hide{display:none!important}
.check{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#2C1650;border:1px solid var(--line);margin:8px 0;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;flex:none;accent-color:var(--teal)}
.timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}.timer.warn{color:var(--coral)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.matrix div{border-radius:14px;padding:12px;font-size:14px;color:#1A0B2E}
.matrix b{display:block;font-size:13px;margin-bottom:4px;letter-spacing:.04em}
.prompt{background:#2C1650;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.ring{width:124px;height:124px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto;box-shadow:0 0 28px #FFD27A44}
.ring span{background:#211036;width:98px;height:98px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:26px;color:#fff!important}
.ring small{font-size:11px;color:var(--muted);font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td input{padding:7px;text-align:center;font-size:15px;width:62px}
td.name input{width:150px;text-align:left}
.lb{display:grid;grid-template-columns:56px 1fr 110px;align-items:center;gap:14px;background:linear-gradient(90deg,#2E1752,#22103A);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:10px 0;opacity:0;transform:translateY(12px);transition:all .5s}
.lb.show{opacity:1;transform:none}
.lb .rk{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#ffffff12;color:#fff}
.lb .nm{font-weight:700;font-size:20px;color:#fff}.lb .xp{font-weight:700;font-size:22px;text-align:right;color:var(--violet);text-shadow:0 0 12px #F5B83D88}
.lb .barw{height:8px;border-radius:9px;background:#ffffff12;margin-top:8px;overflow:hidden}.lb .barw div{height:100%;background:linear-gradient(90deg,#6D28D9,#F5B83D,#F28C28);width:0;transition:width 1s .3s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:380px;margin-top:20px}
.step{width:30%;max-width:250px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:18px;color:#1A0B2E;opacity:0;transform:translateY(40px);transition:all .8s}
.step.show{opacity:1;transform:none}
.step .medal{font-size:54px}.step .n2{font-weight:700;font-size:22px;text-align:center;padding:6px 10px}.step .pp{font-weight:700;font-size:16px;opacity:.85}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;background:#ffffff0a;color:#fff;font:inherit;font-weight:700;font-size:14px}
.pill.on{background:linear-gradient(135deg,#F5B83D,#F28C28);color:#1A0B2E;border-color:transparent;box-shadow:0 0 18px #F5B83D55}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#ffffff14;padding:2px 6px;border-radius:6px}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dealtable th,.dealtable td{font-size:13px;padding:8px 5px}.dealtable td.best{color:#FFD27A;font-weight:700;text-shadow:0 0 10px #FFD27A88}
.brief{border-radius:16px;padding:16px;margin:14px 0;border:1px solid #F5B83D55;background:linear-gradient(135deg,#F5B83D14,#F28C2814);line-height:1.55}
.vs{font-size:26px;font-weight:700;text-align:center;margin:6px 0;background:linear-gradient(90deg,#F5B83D,#F28C28);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>

<div id="toast" class="toast hide"></div>
<script>
"use strict";
/* CONTROL ROOM: Robbins, Coulter & Long (2025) Ch.18; Mullins & Rees (2023) Ch.16. Fictional company: Brightline Logistics. */
const mem = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let S = store.get("cr2_pair", { team: "", pair: 0, avatar: "🐉", xp: {}, done: {}, unlocked: {}, sound: true, data: {} });
let HOST = store.get("cr2_host", null);
const save = () => store.set("cr2_pair", S), saveHost = () => store.set("cr2_host", HOST);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m, ms = 2200) { const t = $("#toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hide"), ms); }
let timers = []; function stopTimers() { timers.forEach(clearInterval); timers = []; }
function view(h) { stopTimers(); $("#app").innerHTML = h; window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function checksum(p, r, s) { const str = `CR1|${p}|${r}|${s}|CTRL`; let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return A[h % 24] + A[Math.floor(h / 24) % 24]; }
const makeCode = (r, s) => `${S.pair}-${r}-${s}-${checksum(S.pair, r, s)}`;
function pop(t, col) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; if (col) d.style.color = col; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function countdown(el, secs, onEnd) { let left = secs; const draw = () => { if (!el) return; el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("warn", left <= 10); }; draw(); const id = setInterval(() => { left--; if (left <= 0) { left = 0; draw(); clearInterval(id); onEnd && onEnd(); } else draw(); }, 1000); timers.push(id); }
let AC = null;
function tone(seq) { if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime; seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * 0.75; }); } catch (e) {} }
const SFX = { good: () => tone([[784, .12], [1175, .22]]), streak: () => tone([[784, .1], [988, .1], [1319, .25]]), soft: () => tone([[392, .2], [349, .25]]), win: () => tone([[523, .12], [659, .12], [784, .12], [1047, .4]]), tap: () => tone([[1200, .05]]) };
function confetti(ms = 3000) { const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight; const cols = ["#F5B83D", "#FFD27A", "#FDBA74", "#F87171", "#F28C28"]; const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 3 + Math.random() * 5, c: cols[Math.floor(Math.random() * 5)], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 })); const end = Date.now() + ms; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .08; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.beginPath(); x.roundRect ? x.roundRect(-p.r, -p.r / 2, p.r * 2, p.r, 2) : x.rect(-p.r, -p.r / 2, p.r * 2, p.r); x.fill(); x.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(); }

// ============================================================ CHAPTERS
const SECTIONS = { A: "Section 1 · The control process", B: "Section 2 · Measuring & controlling performance", C: "Section 3 · Quality, excellence & contemporary issues", D: "Final challenges" };
const CH = [
  { id: 1, sec: "A", key: "CONTROL", title: "Take Control", sub: "Controlling · the control process · KPIs · corrective action", max: 100, ico: "🎛️", col: "#F5B83D", ref: "RCL Ch.18", type: "quiz" },
  { id: 2, sec: "B", key: "MEASURE", title: "Measure What Matters", sub: "Performance measures · discipline · types of control · scorecards · benchmarking", max: 100, ico: "📏", col: "#F28C28", ref: "RCL Ch.18", type: "quiz" },
  { id: 3, sec: "C", key: "QUALITY", title: "Quality & Beyond", sub: "Learning organisation · TQM · EFQM · global, privacy, theft, governance, AI", max: 100, ico: "🏅", col: "#FFD27A", ref: "M&R Ch.16 · RCL Ch.18", type: "quiz" },
  { id: 4, sec: "D", key: "SIMULATE", title: "The Control Room", sub: "Simulation · run the distribution centre for a year", max: 150, ico: "📈", col: "#F5B83D", ref: "All readings", type: "sim" },
  { id: 5, sec: "D", key: "DEAL", title: "The Supplier Deal", sub: "Negotiation · pair vs pair", max: 150, ico: "🤝", col: "#F28C28", ref: "All readings", type: "duel" },
  { id: 6, sec: "D", key: "LIGHTNING", title: "Lightning Round", sub: "Bonus if time allows · 10 rapid-fire questions", max: 100, ico: "⚡", col: "#FDBA74", ref: "All readings", type: "blitz" },
];
const TOTAL = CH.reduce((a, c) => a + c.max, 0);
const C = (id) => CH.find((x) => x.id === id);
const RANKS = [[0, "Shift Supervisor"], [100, "Team Leader"], [200, "Operations Analyst"], [320, "Site Manager"], [440, "Operations Director"], [540, "Chief Operating Officer"], [630, "Control Room Legend"]];
const rank = (xp) => RANKS.filter((r) => xp >= r[0]).pop()[1];
const totalXP = () => Object.values(S.xp).reduce((a, b) => a + b, 0);

const Q = {
1: [
  { f: "", n: "", s: "", q: "Controlling is the management function that involves…", o: ["Monitoring, comparing and correcting work performance", "Setting goals, choosing strategies and making detailed plans", "Designing structure and managing human resources", "Motivating, leading and communicating with people"], w: "Controlling: monitoring, comparing and correcting work performance." },
  { f: "", n: "", s: "", q: "Exhibit 18-1 shows how controlling links to three things. Which are they?", o: ["Planning, empowering employees, protecting the workplace", "Hiring, training and paying all employees fairly every year", "Pricing, promotion and distribution", "Budgeting, forecasting and auditing"], w: "Exhibit 18-1: controlling links back to planning, supports empowering employees and helps protect the workplace." },
  { f: "☕", n: "Café chain", s: "Head office sets a target: 95% of orders served within 4 minutes.", q: "In the control process, this target is the…", o: ["Standard", "Range of variation", "Benchmark", "Feedback control"], w: "Actual performance is compared against a standard; KPIs help define what to measure." },
  { f: "", n: "", s: "", q: "What are the three steps of the control process, in order?", o: ["Measure, compare, take managerial action", "Compare, measure, then revise the whole plan", "Plan, organise, lead, then control", "Take action, measure, then compare"], w: "Exhibit 18-2: measuring actual performance, comparing it against the standard, taking managerial action." },
  { f: "", n: "", s: "", q: "A key performance indicator (KPI) is…", o: ["A measurable target aligned with strategic goals", "A ranking of the firm's main competitors by size", "A penalty for staff who miss their targets", "The budget each department receives"], w: "KPI: a measurable target aligned with strategic goals that indicates how the company is performing." },

// ============================================================ CHAPTER TIMERS (minutes of play per chapter)
const LIMIT = { 1: 7, 2: 7, 3: 7, 4: 15, 5: 14, 6: 5 };
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function startChTimer(id) { if (!S.data["t" + id]) { S.data["t" + id] = Date.now(); save(); } runChTimer(id); }
function chLeft(id) { return Math.max(0, Math.round(LIMIT[id] * 60 - (Date.now() - S.data["t" + id]) / 1000)); }
function runChTimer(id) {
  clearInterval(window._cht); let warned = false;
  const tick = () => {
    if (S.done[id]) return clearInterval(window._cht);
    const left = chLeft(id), el = $("#cht");
    if (el) { el.textContent = "⏱ " + fmt(left); el.style.color = left <= 60 ? "var(--coral)" : ""; }
    if (left <= 60 && left > 0 && !warned) { warned = true; toast("⏰ 1 minute left in this chapter!"); }
    if (left <= 0) { clearInterval(window._cht); timeUp(id); }
  };
  tick(); window._cht = setInterval(tick, 1000);
}
function timeUp(id) {
  if (C(id).type === "quiz" && B && B.id === id) { const xp = B.xp, line = `⏰ Time's up! ${B.correct} correct before the bell · best streak ${B.best} 🔥`; S.data["rev" + id] = B.rev.join(""); B = null; finish(id, xp, line); }
  else toast("⏰ Time's up! Finish this chapter now.", 4000);
}
const timerChip = () => `<span class="chip" id="cht" style="font-variant-numeric:tabular-nums">⏱</span>`;

window.addEventListener("hashchange", route);
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }

function openCh(id) {

    setTimeout(() => $("#code") && $("#code").focus(), 50); return;
  }
  ({ quiz: quizIntro, sim, blitz, duel })[c.type](id);
}
function tryUnlock(id) { const i = $("#code"); if (i.value.trim().toUpperCase() === C(id).key) { S.unlocked[id] = true; save(); SFX.win(); toast("Chapter unlocked 🔓"); openCh(id); } else { i.classList.add("shake"); setTimeout(() => i.classList.remove("shake"), 400); toast("Not quite: check the slide"); } }
function finish(id, xp, line) { clearInterval(window._cht); S.xp[id] = xp; S.done[id] = true; S.data["line" + id] = line || ""; save(); if (xp >= C(id).max * 0.7) { SFX.win(); confetti(2500); } result(id); }
function result(id) {
  const c = C(id), xp = S.xp[id], pct = xp / c.max;
  view(`<div class="wrap">${topBar()}<div class="hero center" style="margin-top:14px"><div style="font-size:44px">${c.ico}</div>
    <h2 style="color:#fff">${pct >= .85 ? "Outstanding!" : pct >= .6 ? "Chapter complete: well done!" : "Chapter complete: keep going!"}</h2>
    <div class="big">${xp}<span style="font-size:22px;opacity:.8"> / ${c.max} XP</span></div>${S.data["line" + id] ? `<p>${S.data["line" + id]}</p>` : ""}</div>
    <div class="card center"><div class="muted">Your score code: show it to your lecturer</div><div class="code">${makeCode(id, xp)}</div></div>

}

// ============================================================ QUIZ (no game over; streak bonus)
let B = null;
function quizIntro(id) {
  const c = C(id);
  view(`<div class="wrap">${topBar()}<div class="hero" style="margin-top:14px"><div style="font-size:40px">${c.ico}</div><h2 style="color:#fff">Chapter ${id}: ${c.title}</h2><p>${c.sub} · ${c.ref}</p></div>
    <div class="card"><h3>How it works</h3><p style="margin:0">${Q[id].length} questions: mostly real situations, plus a few concept checks. Discuss each one quickly with your partner, then choose.</p>
    <ul style="line-height:1.8"><li>✅ Correct: <b>+7 XP</b></li><li>🔥 Streak bonus: <b>+5 XP</b> for every correct answer from your 5th in a row</li><li>Wrong answers never stop you: you just learn why and keep going.</li><li>⏱ You have <b>${LIMIT[id]} minutes</b>. When time's up, the chapter ends with the XP you've earned.</li></ul></div>
    <button class="btn block" onclick="qStart(${id})">Begin chapter →</button></div>`);
}
function qStart(id) { startChTimer(id); B = { id, qs: Q[id].map((q) => ({ ...q, order: shuffle([0, 1, 2, 3]) })), i: 0, xp: 0, correct: 0, streak: 0, best: 0, rev: [] }; qShow(); }
function qShow() {
  const q = B.qs[B.i], n = B.qs.length; setTimeout(() => runChTimer(B ? B.id : 0), 0);
  view(`<div class="wrap">${topBar()}
    <div class="row" style="justify-content:space-between;margin:14px 0 6px"><span class="muted">Question ${B.i + 1} of ${n} · ${timerChip()}</span><span>${B.streak >= 2 ? `<span class="streak">🔥 ${B.streak} in a row</span>` : ""} <b style="color:var(--violet)">${B.xp} XP</b></span></div>
    <div class="bar"><div style="width:${(B.i / n) * 100}%"></div></div>
    <div class="card">${q.s ? `<div class="scene"><div class="face">${q.f}</div><div><div class="who">${q.n}</div><div class="txt">${q.s}</div></div></div><div class="ask">${q.q}</div>` : `<span class="chip" style="background:#F5B83D1f;color:var(--violet);border-color:#F5B83D55">🧠 Concept check</span><div class="ask" style="font-size:20px;margin-top:12px">${q.q}</div>`}
    ${q.order.map((k, pos) => `<button class="opt" data-k="${k}" onclick="qPick(${k})"><span class="k">${"ABCD"[pos]}</span><span>${q.o[k]}</span></button>`).join("")}
    <div id="fb"></div></div></div>`);
}
function qPick(k) {
  if (B.locked) return; B.locked = true; const q = B.qs[B.i], ok = k === 0;
  document.querySelectorAll(".opt").forEach((b) => { const kk = +b.dataset.k; b.disabled = true; if (kk === 0) b.classList.add("right"); else if (kk === k) b.classList.add("wrong"); });
  let gain = 0;
  if (ok) { B.correct++; B.streak++; B.best = Math.max(B.best, B.streak); gain = 7 + (B.streak >= 5 ? 5 : 0); B.xp += gain; B.streak >= 5 ? (SFX.streak(), pop(`+${gain} XP 🔥`)) : (SFX.good(), pop(`+${gain} XP`)); }
  else { B.streak = 0; SFX.soft(); }
  B.rev.push(`<p>${ok ? "✅" : "💭"} ${q.s ? q.s + " " : ""}<b>${q.q}</b><br><span class="muted">${q.o[0]}. ${q.w}</span></p>`);
  const last = B.i + 1 >= B.qs.length;
  $("#fb").innerHTML = `<div class="sheet ${ok ? "ok" : "no"}"><b>${ok ? (B.streak >= 5 ? `🔥 Brilliant: ${B.streak} in a row!` : "✅ Great call!") : "💭 Not this time. Here's why:"}</b><div style="margin-top:6px">${ok ? "" : `Best answer: <b>${q.o[0]}</b>. `}${q.w}</div></div>
    <button class="btn block" style="margin-top:12px" onclick="qNext()">${last ? "Finish chapter 🏁" : "Next question →"}</button>`;
}
function qNext() { B.locked = false; B.i++; if (B.i < B.qs.length) qShow(); else { const id = B.id; S.data["rev" + id] = B.rev.join(""); const line = `${B.correct}/${B.qs.length} correct · best streak ${B.best} 🔥`, xp = B.xp; B = null; finish(id, xp, line); } }

  if (HOST._rv === 1) { b.textContent = "Reveal 2nd place"; SFX.good(); confetti(1000); } else if (HOST._rv === 2) { b.textContent = "Reveal the winners 🥁"; SFX.good(); confetti(1000); } else { b.textContent = "Congratulations! 🎉"; b.disabled = true; SFX.win(); confetti(6000); }
}
function hReset() { $("#hb").innerHTML = `<div class="card"><h3>Start a new game</h3><p>Clears all scores on this device.</p><button class="btn coral" onclick="this.classList.add('hide');this.nextElementSibling.classList.remove('hide')">Clear scoreboard…</button><button class="btn coral hide" onclick="HOST=null;saveHost();hostSetup()">Yes, clear everything</button></div>`; }
route();
</script>
