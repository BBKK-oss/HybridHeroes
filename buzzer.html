<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1A0B2E">
<title>Buzzer Showdown · Control & Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#EEE8F6;--gold:#F5B83D;--gold2:#FCE7B2;--orange:#F28C28;--coral:#F87171;--green:#4ADE80;--muted:#B3A5C9;--card:#2A1548;--line:#5B3F86;--night:#1A0B2E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);overflow:hidden}
body{background:radial-gradient(900px 500px at 0% -10%,#F5B83D2E,transparent),radial-gradient(800px 500px at 110% 0%,#F28C2833,transparent),radial-gradient(700px 500px at 50% 120%,#F28C2822,transparent),var(--night)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
#app{position:relative;height:100vh;display:flex;flex-direction:column;padding:2vh 2.2vw;gap:1.6vh}
h1,h2,h3{margin:0;color:#fff;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;font-size:18px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--orange));color:var(--night);box-shadow:0 0 22px #F5B83D55;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#ffffff0d;color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}
.card{background:linear-gradient(180deg,#30185Aee,#25123Fee);border:1px solid var(--line);border-radius:22px;padding:2.4vh 1.8vw;box-shadow:0 20px 40px #0008}
.top{display:flex;align-items:center;gap:16px}
.top .title{font-weight:700;font-size:clamp(16px,1.6vw,26px);color:#fff}
.pill{border:1px solid var(--line);background:#ffffff0d;border-radius:999px;padding:6px 14px;font-weight:600;font-size:clamp(13px,1.1vw,18px);color:var(--gold2);white-space:nowrap}
.spacer{flex:1}
.main{flex:1;display:grid;grid-template-columns:1fr minmax(240px,22vw);gap:1.6vw;min-height:0}
.stage{display:flex;flex-direction:column;gap:1.6vh;min-height:0}
.qcard{flex:0 0 auto;position:relative}
.qtext{font-size:clamp(22px,2.6vw,46px);font-weight:700;line-height:1.2;color:#fff}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.2vw;flex:1;min-height:0}
.opt{display:flex;align-items:center;gap:1vw;border-radius:18px;border:2px solid var(--line);background:#ffffff0a;padding:1.4vh 1.2vw;font-size:clamp(17px,1.7vw,30px);font-weight:600;color:#fff;cursor:pointer;transition:all .2s;text-align:left}
.opt .let{flex:0 0 auto;width:2.2em;height:2.2em;border-radius:12px;display:grid;place-items:center;background:#ffffff14;color:var(--gold);font-weight:700}
.opt.correct{border-color:var(--green);background:#4ADE8026;box-shadow:0 0 30px #4ADE8055}
.opt.correct .let{background:var(--green);color:var(--night)}
.opt.wrong{border-color:var(--coral);background:#F8717122;opacity:.75}
.opt.wrong .let{background:var(--coral);color:var(--night)}
.opt.dim{opacity:.35}
.status{display:flex;align-items:center;gap:1.2vw;min-height:9vh}
.bar{flex:1;height:16px;border-radius:999px;background:#ffffff12;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--orange));transform-origin:left;transition:transform .1s linear}
.bar.answer i{background:linear-gradient(90deg,#60A5FA,#A78BFA)}
.big{font-size:clamp(22px,2.4vw,40px);font-weight:700;color:#fff}
.secs{font-variant-numeric:tabular-nums;font-size:clamp(26px,3vw,52px);font-weight:700;color:var(--gold);min-width:2.2em;text-align:right}
.why{font-size:clamp(15px,1.35vw,23px);color:#EAE2F4;line-height:1.4;border-left:4px solid var(--green);padding:.6vh 1vw;background:#4ADE800f;border-radius:0 12px 12px 0}
.why b{color:var(--green)}
.board{display:flex;flex-direction:column;gap:1vh;min-height:0;overflow:auto}
.board h3{font-size:clamp(15px,1.2vw,20px);color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.team{position:relative;display:flex;align-items:center;gap:10px;border-radius:16px;border:2px solid var(--line);background:#ffffff0a;padding:1.1vh .9vw;cursor:pointer;transition:all .2s}
.team .key{flex:0 0 auto;width:1.9em;height:1.9em;border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--night)}
.team .nm{flex:1;font-weight:700;font-size:clamp(14px,1.25vw,22px);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .sc{font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(16px,1.5vw,26px);color:var(--gold2)}
.team .adj{display:none;gap:4px}
.team:hover .adj{display:flex}
.adj button{border:1px solid var(--line);background:#ffffff14;color:#fff;border-radius:8px;width:26px;height:26px;cursor:pointer;font:inherit;font-weight:700}
.team.buzzed{border-color:var(--gold);background:#F5B83D26;box-shadow:0 0 34px #F5B83D88;transform:scale(1.04)}
.team.locked{opacity:.35}
.team.lead .nm:after{content:" 👑"}
.hint{font-size:clamp(12px,.95vw,16px);color:var(--muted);display:flex;gap:1.4vw;flex-wrap:wrap}
kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#ffffff14;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:1px 7px;color:#fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2.4vh}
.mega{font-size:clamp(40px,6vw,104px);font-weight:700;line-height:1;color:#fff;letter-spacing:-.04em}
.mega span{background:linear-gradient(135deg,var(--gold),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(17px,1.6vw,28px);color:#EAE2F4;max-width:60vw;line-height:1.4}
.setup{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:min(1100px,90vw)}
.setup input{width:100%;font:inherit;font-size:18px;font-weight:600;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#ffffff0d;color:#fff}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
.row label{color:var(--muted);font-weight:600}
.row select{font:inherit;font-size:17px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:#fff}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:min(1200px,92vw);text-align:left}
.rules .card{padding:18px}
.rules b{display:block;color:var(--gold);font-size:20px;margin-bottom:6px}
.rules p{margin:0;color:#EAE2F4;font-size:16px;line-height:1.45}
.ranks{display:flex;flex-direction:column;gap:10px;width:min(800px,80vw)}
.rk{display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:16px;border:1px solid var(--line);background:#ffffff0a;font-size:clamp(18px,1.7vw,28px);font-weight:700;color:#fff}
.rk .p{width:2em;color:var(--gold)}.rk .n{flex:1;text-align:left}.rk .s{color:var(--gold2);font-variant-numeric:tabular-nums}
.podium{display:flex;align-items:flex-end;gap:2vw}
.pod{width:16vw;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2vh;gap:1vh;background:linear-gradient(180deg,#4C2489,#2C1650);border:1px solid var(--line);color:#fff}
.pod .m{font-size:clamp(40px,4.5vw,80px)}.pod .n{font-weight:700;font-size:clamp(16px,1.6vw,28px);padding:0 10px}.pod .s{color:var(--gold2);font-weight:700;font-size:clamp(16px,1.5vw,26px)}
.pod.p1{height:42vh;box-shadow:0 0 60px #F5B83D55}.pod.p2{height:32vh}.pod.p3{height:24vh}
.flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.pop{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(40px,6vw,110px);font-weight:700;pointer-events:none;animation:pop 1.1s forwards;z-index:9;text-shadow:0 10px 40px #000a}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards;z-index:8;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===================== QUESTIONS (theory slides only) ===================== */
const ROUNDS=[
{name:"Round 1 · The control process",icon:"🎛️",src:"Robbins, Coulter & Long Ch. 18",pts:100,qs:[
{q:"Controlling is the management function of monitoring, comparing and … work performance.",o:["Delegating","Planning","Correcting","Rewarding"],a:2,why:"Controlling = monitoring, comparing and correcting work performance."},
{q:"Exhibit 18-1: control adds value in three specific areas. Which set is right?",o:["Planning, empowering employees, protecting the workplace","Hiring, firing, promoting","Budgeting, pricing, marketing","Leading, motivating, communicating"],a:0,why:"Control links back to planning, makes managers comfortable empowering employees, and protects the organisation and its assets."},
{q:"What is the correct order of the three-step control process?",o:["Compare → measure → act","Measure → compare → take managerial action","Act → measure → compare","Set goals → reward → measure"],a:1,why:"Step 1 measure actual performance, Step 2 compare it with the standard, Step 3 take managerial action."},
{q:"A measurable target aligned with strategic goals that shows how the company is performing is a…",o:["Benchmark","Budget","Range of variation","Key performance indicator (KPI)"],a:3,why:"A KPI is a measurable target aligned with strategic goals (Exhibit 18-3 gives examples)."},
{q:"In Exhibit 18-3, ‘monthly absenteeism rate’ and ‘cost per new hire’ are KPIs for which department?",o:["Human Resources","Sales","Customer Service","Finance"],a:0,why:"HR KPIs: overtime hours, training costs, cost per new hire, productivity, absenteeism."},
{q:"The acceptable parameters of variance between actual performance and the standard are called the…",o:["Error margin","Range of variation","Standard deviation","Control limit budget"],a:1,why:"Range of variation (Exhibit 18-4): only deviations outside this range need attention."},
{q:"A manager first asks HOW and WHY performance deviated, then fixes the source. This is…",o:["Immediate corrective action","Revising the standard","Basic corrective action","Doing nothing"],a:2,why:"Basic corrective action looks at how and why before correcting the source. Immediate action just gets performance back on track at once."}
]},
{name:"Round 2 · Measuring & controlling performance",icon:"📏",src:"Robbins, Coulter & Long Ch. 18",pts:200,qs:[
{q:"Organizational productivity is…",o:["Profit ÷ number of employees","Goods or services produced ÷ inputs needed","How appropriate the goals are","Sales growth per quarter"],a:1,why:"Productivity = output ÷ inputs. ‘How appropriate goals are’ is organizational effectiveness."},
{q:"Progressive disciplinary action aims to…",o:["Impose the minimum penalty appropriate to the offense","Punish every offense with dismissal","Reward the best performers","Let employees set their own penalties"],a:0,why:"Progressive discipline ensures the minimum penalty appropriate to the offense is imposed."},
{q:"‘Management by walking around’ is the best-known form of…",o:["Feedforward control","Feedback control","Financial control","Concurrent control"],a:3,why:"Concurrent control happens while the work is in progress, e.g. direct supervision / management by walking around."},
{q:"Which type of control takes place BEFORE a work activity and anticipates problems?",o:["Feedback control","Concurrent control","Feedforward control","Budget control"],a:2,why:"Feedforward control (input stage) prevents problems before they happen."},
{q:"Current ratio and acid test are examples of which type of financial ratio?",o:["Leverage","Liquidity","Activity","Profitability"],a:1,why:"Liquidity ratios test the ability to meet short-term obligations (Exhibit 18-10)."},
{q:"The balanced scorecard looks at four areas. Which set is right?",o:["Financial, customer, internal processes, people/innovation/growth","Price, product, place, promotion","Political, economic, social, technological","Planning, organizing, leading, controlling"],a:0,why:"Balanced scorecard: financial, customer, internal processes, and people/innovation/growth assets."},
{q:"Benchmarking is the search for best practices among…",o:["Only your own department","Only direct competitors","Only government agencies","Competitors or noncompetitors"],a:3,why:"Benchmarking = best practices among competitors OR noncompetitors that lead to superior performance."}
]},
{name:"Round 3 · Quality, excellence & contemporary issues",icon:"🏅",src:"Mullins & Rees Ch. 16 · Robbins Ch. 18",pts:300,qs:[
{q:"An organisation that facilitates the learning of all its members and continually transforms itself is a…",o:["Bureaucracy","Learning organisation","Matrix organisation","Virtual organisation"],a:1,why:"Learning organisation: learning is shared across the organisation and supports adaptation to change."},
{q:"In Total Quality Management (TQM), quality is the job of…",o:["Everyone in the organisation","The quality department only","Top management only","External auditors"],a:0,why:"TQM is an organisation-wide commitment to quality and continuous improvement, focused on customer needs."},
{q:"Who developed the balanced scorecard?",o:["Michael Porter","Henri Fayol","Kaplan and Norton","W. Edwards Deming"],a:2,why:"Kaplan and Norton developed the balanced scorecard."},
{q:"In the EFQM Excellence Model, how is the weighting split?",o:["Leadership 80% / Results 20%","Enablers 50% / Results 50%","Customers 70% / People 30%","Financial 100%"],a:1,why:"Enablers (what an organisation does) 50%, Results (what it achieves) 50%."},
{q:"In global organisations, distance from the home office tends to create…",o:["No control at all","Only informal chats","Daily site visits","Formalized controls, e.g. formal reports"],a:3,why:"Distance means managers can’t observe work directly, so controls become formalized."},
{q:"Exhibit 18-12: ‘use careful prehiring screening’ to control employee theft is a … control.",o:["Feedforward","Concurrent","Feedback","Financial"],a:0,why:"Screening happens before the person starts work, so it is feedforward."},
{q:"Corporate governance is the system used to govern a corporation so that the interests of … are protected.",o:["Customers","Corporate owners","Suppliers","Competitors"],a:1,why:"Corporate governance protects owners’ interests (boards, audit committees, compliance)."},
{q:"How can AI ease workplace-privacy concerns in the control process?",o:["By reading every private email","By replacing all managers","By analysing data at group/organisational level without revealing identities","By banning all monitoring"],a:2,why:"AI can look at group or organisational data without compromising employee identities."}
]}
];
const COLORS=["#F5B83D","#60A5FA","#4ADE80","#F87171","#C084FC","#2DD4BF","#FB923C","#F472B6"];
const LET=["A","B","C","D"];

/* ===================== STATE ===================== */
let S={screen:"setup",teams:[],nTeams:7,buzzSecs:10,ansSecs:5,penalty:true,r:0,qi:0,phase:"ready",buzzed:-1,locked:[],picked:[],result:null};
let timer=null,tEnd=0,tLen=0;
try{const sv=JSON.parse(localStorage.getItem("buzzerControl")||"null");if(sv&&sv.teams)S=Object.assign(S,sv,{phase:sv.phase==="revealed"?"revealed":"ready",buzzed:-1});}catch(e){}
function save(){try{localStorage.setItem("buzzerControl",JSON.stringify(S));}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const R=()=>ROUNDS[S.r], Q=()=>R().qs[S.qi];
const totalQ=ROUNDS.reduce((n,r)=>n+r.qs.length,0);

/* ===================== SOUND ===================== */
let AC=null;
function tone(freq,dur,type="square",vol=.12,when=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+when;o.start(t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.stop(t+dur+.02);}catch(e){}}
const sBuzz=()=>{tone(220,.35,"sawtooth",.16);tone(165,.35,"sawtooth",.1)};
const sOk=()=>{tone(660,.15,"triangle",.18);tone(880,.25,"triangle",.18,.12);tone(1320,.35,"triangle",.14,.24)};
const sBad=()=>{tone(140,.5,"square",.14);tone(110,.5,"square",.1,.05)};
const sTick=()=>tone(1200,.04,"sine",.05);
const sOpen=()=>{tone(523,.1,"sine",.15);tone(784,.15,"sine",.15,.1)};

/* ===================== TIMERS ===================== */
function startTimer(secs,onEnd){stopTimer();tLen=secs*1000;tEnd=Date.now()+tLen;let lastS=-1;
  timer=setInterval(()=>{const left=Math.max(0,tEnd-Date.now());const b=$(".bar i");if(b)b.style.transform=`scaleX(${left/tLen})`;
    const s=Math.ceil(left/1000);const el=$(".secs");if(el)el.textContent=s;if(s!==lastS&&s<=3&&s>0)sTick();lastS=s;
    if(left<=0){stopTimer();onEnd();}},80);}
function stopTimer(){if(timer)clearInterval(timer);timer=null;}

/* ===================== GAME FLOW ===================== */
function openBuzzers(){if(S.phase==="revealed")return;
  const free=S.teams.map((t,i)=>i).filter(i=>!S.locked.includes(i));if(!free.length){reveal(null);return;}
  S.phase="open";S.buzzed=-1;render();sOpen();
  startTimer(S.buzzSecs,()=>{if(S.phase==="open")reveal(null,"⏰ Nobody buzzed in");});}
function buzz(i){if(i<0||i>=S.teams.length)return;if(S.phase!=="open"&&S.phase!=="ready")return;if(S.locked.includes(i))return;
  S.phase="answering";S.buzzed=i;sBuzz();render();startTimer(S.ansSecs,()=>{const s=$(".secs");if(s)s.textContent="⏱";});}
function answer(k){if(S.phase!=="answering"||S.buzzed<0)return;if(S.picked.includes(k))return;stopTimer();
  const t=S.teams[S.buzzed],pts=R().pts;
  if(k===Q().a){t.score+=pts;S.picked.push(k);pop("+"+pts+" "+t.name,"var(--green)");sOk();reveal(S.buzzed);}
  else{if(S.penalty)t.score-=pts/2;S.picked.push(k);S.locked.push(S.buzzed);pop(S.penalty?("−"+pts/2):"✗","var(--coral)");sBad();
    S.buzzed=-1;S.phase="ready";save();render();
    if(S.locked.length<S.teams.length&&S.picked.length<3)setTimeout(()=>{if(S.phase==="ready")openBuzzers();},1100);
    else setTimeout(()=>reveal(null,"No more steals"),900);}}
function reveal(winner,msg){stopTimer();S.phase="revealed";S.result={winner,msg:msg||null};save();render();}
function next(){stopTimer();
  if(S.screen==="rules"){S.screen="roundIntro";}
  else if(S.screen==="roundIntro"){S.screen="question";resetQ();}
  else if(S.screen==="question"){if(S.phase!=="revealed"){if(S.phase==="ready")openBuzzers();return;}
    if(S.qi<R().qs.length-1){S.qi++;resetQ();}else S.screen="roundEnd";}
  else if(S.screen==="roundEnd"){if(S.r<ROUNDS.length-1){S.r++;S.qi=0;S.screen="roundIntro";}else{S.screen="final";}}
  save();render();if(S.screen==="final")celebrate();}
function resetQ(){S.phase="ready";S.buzzed=-1;S.locked=[];S.picked=[];S.result=null;}
function adj(i,d){S.teams[i].score+=d;save();render();}

/* ===================== RENDER ===================== */
function ranked(){return S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score);}
function render(){const A=$("#app");
  if(S.screen==="setup")return A.innerHTML=setupView();
  if(S.screen==="rules")return A.innerHTML=rulesView();
  if(S.screen==="roundIntro")return A.innerHTML=introView();
  if(S.screen==="roundEnd")return A.innerHTML=roundEndView();
  if(S.screen==="final")return A.innerHTML=finalView();
  A.innerHTML=questionView();}
function topBar(extra=""){const done=ROUNDS.slice(0,S.r).reduce((n,r)=>n+r.qs.length,0)+S.qi+1;
  return `<div class="top"><div class="title">🔔 Buzzer Showdown · Control & Performance</div><div class="spacer"></div>${extra}
  <span class="pill">${esc(R().icon)} ${esc(R().name.split(" · ")[0])}</span><span class="pill">Q ${done}/${totalQ}</span><span class="pill">${R().pts} pts</span>
  <button class="btn ghost small" onclick="menu()">☰</button></div>`;}
function setupView(){let inp="";for(let i=0;i<8;i++)inp+=`<input id="tn${i}" placeholder="Pair ${i+1}" value="${esc((S.teams[i]&&S.teams[i].name)||"")}" style="border-color:${COLORS[i]}66;${i>=S.nTeams?"opacity:.3":""}">`;
  return `<div class="center"><div class="mega">🔔 Buzzer <span>Showdown</span></div>
  <div class="sub">Control & Performance · ${totalQ} questions from the theory slides (Robbins Ch. 18 · Mullins & Rees Ch. 16)</div>
  <div class="row"><label>Pairs</label><select id="nT" onchange="S.nTeams=+this.value;render()">${[2,3,4,5,6,7,8].map(n=>`<option ${n===S.nTeams?"selected":""}>${n}</option>`).join("")}</select>
  <label>Buzz window</label><select id="bS">${[5,8,10,15].map(n=>`<option value="${n}" ${n===S.buzzSecs?"selected":""}>${n}s</option>`).join("")}</select>
  <label>Answer time</label><select id="aS">${[3,5,8].map(n=>`<option value="${n}" ${n===S.ansSecs?"selected":""}>${n}s</option>`).join("")}</select>
  <label>Wrong answer</label><select id="pen"><option value="1" ${S.penalty?"selected":""}>−50% points</option><option value="0" ${!S.penalty?"selected":""}>no penalty</option></select></div>
  <div class="setup">${inp}</div>
  <div class="row"><button class="btn" onclick="startGame()">Start the show ▶</button>${S.teams.length?`<button class="btn ghost" onclick="S.screen=S.teams.length?'question':'setup';render()">Resume saved game</button>`:""}</div>
  <div class="hint">Team names are optional: leave blank to use “Pair 1, Pair 2…”. Press <kbd>F</kbd> for full screen.</div></div>`;}
function startGame(){const n=+$("#nT").value;S.nTeams=n;S.buzzSecs=+$("#bS").value;S.ansSecs=+$("#aS").value;S.penalty=$("#pen").value==="1";
  S.teams=[];for(let i=0;i<n;i++)S.teams.push({name:($("#tn"+i).value.trim()||"Pair "+(i+1)).slice(0,22),score:0,color:COLORS[i]});
  S.r=0;S.qi=0;resetQ();S.screen="rules";save();render();}
function rulesView(){return `<div class="center"><div class="mega">How to <span>play</span></div>
  <div class="rules">
  <div class="card"><b>1 · Read</b><p>The question and four answers appear. Nobody buzzes yet: read it with your partner.</p></div>
  <div class="card"><b>2 · Buzz</b><p>When the lecturer opens the buzzers, slap the table and raise your hand. Fastest pair answers.</p></div>
  <div class="card"><b>3 · Answer</b><p>Say the letter within ${S.ansSecs} seconds. Right = points. Wrong = ${S.penalty?"lose half":"no points"} and the others can steal.</p></div>
  <div class="card"><b>4 · Win</b><p>Three rounds: 100, 200, then 300 points per question. Top 3 pairs take the podium 🏆</p></div>
  </div><button class="btn" onclick="next()">Let's go ▶</button></div>`;}
function introView(){const r=R();return `<div class="center"><div style="font-size:clamp(60px,8vw,140px)">${r.icon}</div>
  <div class="mega">${esc(r.name.split(" · ")[0])}<br><span>${esc(r.name.split(" · ")[1])}</span></div>
  <div class="sub">${r.qs.length} questions · <b style="color:var(--gold)">${r.pts} points</b> each · ${esc(r.src)}</div>
  <button class="btn" onclick="next()">Start round ▶</button></div>`;}
function teamTiles(){const lead=Math.max(...S.teams.map(t=>t.score));
  return S.teams.map((t,i)=>`<div class="team ${S.buzzed===i?"buzzed":""} ${S.locked.includes(i)?"locked":""} ${t.score===lead&&lead>0?"lead":""}" onclick="buzz(${i})">
  <span class="key" style="background:${t.color}">${i+1}</span><span class="nm">${esc(t.name)}</span>
  <span class="adj" onclick="event.stopPropagation()"><button onclick="adj(${i},-50)">−</button><button onclick="adj(${i},50)">+</button></span>
  <span class="sc">${t.score}</span></div>`).join("");}
function questionView(){const q=Q();let status="";
  if(S.phase==="ready")status=`<div class="big">Read the question… 🤫</div><div class="spacer"></div><button class="btn" onclick="openBuzzers()">🔔 Open buzzers <kbd style="margin-left:6px">Space</kbd></button>`;
  else if(S.phase==="open")status=`<div class="big">🔔 BUZZ NOW!</div><div class="bar"><i></i></div><div class="secs">${S.buzzSecs}</div>`;
  else if(S.phase==="answering"){const t=S.teams[S.buzzed];status=`<div class="big" style="color:${t.color}">🎤 ${esc(t.name)}, your answer?</div><div class="bar answer"><i></i></div><div class="secs">${S.ansSecs}</div><button class="btn ghost small" onclick="cancelBuzz()">Undo</button>`;}
  else{const w=S.result&&S.result.winner;status=`<div class="why"><b>${w!=null&&w>=0?"✅ "+esc(S.teams[w].name)+" got it!":esc((S.result&&S.result.msg)||"Answer")}</b> &nbsp;${LET[q.a]}: ${esc(q.why)}</div><div class="spacer"></div><button class="btn" onclick="next()">Next ▶</button>`;}
  const opts=q.o.map((o,k)=>{let c="";if(S.phase==="revealed")c=k===q.a?"correct":(S.picked.includes(k)?"wrong":"dim");else if(S.picked.includes(k))c="wrong";
    return `<div class="opt ${c}" onclick="answer(${k})"><span class="let">${LET[k]}</span><span>${esc(o)}</span></div>`;}).join("");
  return `${topBar()}<div class="main"><div class="stage">
    <div class="card qcard"><div class="qtext">${esc(q.q)}</div></div>
    <div class="opts">${opts}</div>
    <div class="card status" style="padding:1.4vh 1.4vw">${status}</div>
    <div class="hint"><span><kbd>Space</kbd> open buzzers / next</span><span><kbd>1</kbd>–<kbd>${S.teams.length}</kbd> pair buzzed</span><span><kbd>A</kbd>–<kbd>D</kbd> their answer</span><span><kbd>R</kbd> reveal</span><span><kbd>Esc</kbd> undo buzz</span><span><kbd>F</kbd> full screen</span><span>hover a pair for ± score</span></div>
  </div><div class="board"><h3>Scoreboard</h3>${teamTiles()}</div></div>`;}
function cancelBuzz(){stopTimer();S.buzzed=-1;S.phase="ready";render();}
function rankList(){return ranked().map((t,n)=>`<div class="rk"><span class="p">${["🥇","🥈","🥉"][n]||n+1}</span><span class="key" style="width:14px;height:14px;border-radius:4px;background:${t.color}"></span><span class="n">${esc(t.name)}</span><span class="s">${t.score}</span></div>`).join("");}
function roundEndView(){return `<div class="center"><div class="mega">End of <span>${esc(R().name.split(" · ")[0])}</span></div>
  <div class="ranks">${rankList()}</div><button class="btn" onclick="next()">${S.r<ROUNDS.length-1?"Next round ▶":"Final results 🏆"}</button></div>`;}
function finalView(){const r=ranked();const p=(t,c,m)=>t?`<div class="pod ${c}"><div class="m">${m}</div><div class="n">${esc(t.name)}</div><div class="s">${t.score} pts</div></div>`:"";
  return `<div class="center"><div class="mega">🏆 <span>Champions</span></div>
  <div class="podium">${p(r[1],"p2","🥈")}${p(r[0],"p1","🥇")}${p(r[2],"p3","🥉")}</div>
  <div class="row"><button class="btn ghost" onclick="S.screen='roundEnd';render()">Full ranking</button><button class="btn ghost" onclick="newGame()">New game</button></div></div>`;}
function newGame(){if(!confirmSoft())return;S.teams=[];S.screen="setup";S.r=0;S.qi=0;resetQ();save();render();}
function confirmSoft(){return true;}
function menu(){const m=prompt("Type: 1 = jump to Round 1, 2 = Round 2, 3 = Round 3, s = scoreboard, n = new game");if(!m)return;
  if(["1","2","3"].includes(m)){stopTimer();S.r=+m-1;S.qi=0;S.screen="roundIntro";}else if(m==="s"){S.screen="roundEnd";}else if(m==="n"){S.teams=[];S.screen="setup";}save();render();}

/* ===================== FX ===================== */
function pop(txt,color){const d=document.createElement("div");d.className="pop";d.style.color=color;d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
function celebrate(){sOk();setTimeout(sOk,400);for(let i=0;i<120;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=COLORS[i%8];c.style.animationDuration=(2.5+Math.random()*2.5)+"s";c.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),7000);}}

/* ===================== KEYS ===================== */
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;const k=e.key.toLowerCase();
  if(k==="f"){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();return;}
  if(S.screen!=="question"){if(k===" "||k==="enter"||k==="arrowright"){e.preventDefault();if(S.screen!=="setup")next();}return;}
  if(k===" "||k==="enter"||k==="arrowright"||k==="n"){e.preventDefault();next();}
  else if(/^[1-8]$/.test(k))buzz(+k-1);
  else if("abcd".includes(k)&&k.length===1)answer("abcd".indexOf(k));
  else if(k==="r")reveal(null,"Answer");
  else if(k==="escape")cancelBuzz();});
render();
</script>
</body>
</html>
