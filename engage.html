<!DOCTYPE html>

<style>
:root{--indigo:#F1F5F4;--ink:#E6EEEB;--violet:#34D399;--violet2:#A7F3D0;--teal:#6EE7B7;--amber:#D7DEE0;--coral:#F87171;--blue:#C0C8CC;--muted:#9FB3AD;--bg:#1E3B33;--card:#234539;--line:#3F6B5D;--night:#183229}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(900px 500px at 0% -10%,#34D3992E,transparent),radial-gradient(800px 500px at 110% 0%,#C0C8CC33,transparent),radial-gradient(700px 500px at 50% 120%,#C0C8CC22,transparent),var(--night);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);z-index:0}
#app{position:relative;z-index:1}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 100px}
.wide{max-width:1200px}
h1{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:.2em 0 .3em;color:#fff}
h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:.3em 0 .5em;color:#fff}
h3{font-size:18px;font-weight:700;margin:.2em 0 .5em;color:#fff}
p{line-height:1.55}
a{color:var(--violet)}
.card{background:linear-gradient(180deg,#26493Fee,#1F3C34ee);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 20px 40px #0008;backdrop-filter:blur(10px)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#21423A 0%,#2A5A49 55%,#357A62 100%);color:#fff;border-radius:24px;padding:22px;border:1px solid #ffffff1f;box-shadow:0 0 0 1px #34D39922,0 20px 50px #34D39922,inset 0 1px 0 #ffffff22}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#34D39955,transparent 70%);pointer-events:none}
.hero p{color:#E3EBE8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#34D399,#C0C8CC);color:#183229;margin:6px 6px 6px 0;box-shadow:0 0 22px #34D39955;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 32px #34D39988}.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#ffffff0d;color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn.teal{background:linear-gradient(135deg,#6EE7B7,#34D399);box-shadow:0 0 22px #6EE7B755}
.btn.coral{background:linear-gradient(135deg,#F87171,#DC2626);color:#fff;box-shadow:0 0 22px #F8717155}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;border-radius:12px;border:1.5px solid var(--line);background:#1B372F;color:#fff;padding:12px 13px;width:100%;outline:none}
input::placeholder{color:#7F9C93}
input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #34D39933}
label{font-weight:700;font-size:14px;display:block;margin:14px 0 6px;color:var(--violet2)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:#ffffff0f;border:1px solid var(--line);color:#fff}
.chip.dark{background:#ffffff1a;color:#fff;border-color:#ffffff2a}
.brand{font-weight:700;font-size:14px;letter-spacing:.18em;background:linear-gradient(90deg,#1F7A5A,#34D399,#C0C8CC);-webkit-background-clip:text;background-clip:text;color:transparent}
.chapter{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;margin:10px 0;cursor:pointer;border:1px solid var(--line);width:100%;text-align:left;font:inherit;color:var(--ink);background:linear-gradient(180deg,#24473D,#1E3B33);transition:transform .12s,border-color .12s,box-shadow .12s}
.chapter:hover{transform:translateY(-2px);border-color:#34D39988;box-shadow:0 0 24px #34D39933}
.chapter .ico{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.chapter .t{font-weight:700;font-size:16px;color:#fff}
.chapter .s{font-size:13px;color:var(--muted);margin-top:2px}
.chapter .pts{margin-left:auto;font-weight:700;font-size:13px;white-space:nowrap;text-align:right;color:var(--muted)}
.chapter.locked{opacity:.55}
.chapter.done{border-color:#6EE7B766}.chapter.done .pts{color:var(--teal)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#21423A;color:var(--ink);border-radius:14px;padding:14px;margin:10px 0;font:inherit;font-size:16px;cursor:pointer;transition:all .15s;line-height:1.45}
.opt:hover{border-color:var(--violet);box-shadow:0 0 18px #34D39933;transform:translateX(2px)}
.opt .k{width:28px;height:28px;border-radius:8px;background:#34D3991f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;color:var(--violet)}
.opt.right{border-color:var(--teal);background:#6EE7B714;box-shadow:0 0 18px #6EE7B733}.opt.right .k{background:var(--teal);color:#183229}
.opt.wrong{border-color:var(--coral);background:#F8717114}.opt.wrong .k{background:var(--coral);color:#fff}
.opt.gone{opacity:.25;pointer-events:none}
.scene{display:flex;gap:12px;align-items:flex-start}
.face{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#34D39933,#C0C8CC33);border:1px solid #ffffff1f;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.scene .who{font-size:13px;font-weight:700;color:var(--violet)}
.scene .txt{font-size:17px;line-height:1.5;margin-top:2px}
.ask{font-weight:700;font-size:17px;margin:14px 0 4px;color:#fff}
.sheet{border-radius:16px;padding:14px 16px;margin-top:12px;animation:rise .3s ease}
.sheet.ok{background:#6EE7B712;border:1.5px solid #6EE7B766}.sheet.no{background:#D7DEE010;border:1.5px solid #D7DEE066}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bar{height:10px;border-radius:99px;background:#ffffff12;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#1F7A5A,#34D399,#C0C8CC);box-shadow:0 0 12px #34D39988;transition:width .5s}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:#A3E635;text-shadow:0 0 12px #A3E63588}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-weight:700;font-size:28px;color:var(--teal);pointer-events:none;animation:pop 1s forwards;z-index:60;text-shadow:0 0 18px #6EE7B7}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{transform:translate(-50%,-70px);opacity:0}}
.big{font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,#fff,#A7F3D0);-webkit-background-clip:text;background-clip:text;color:transparent}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;background:#183229;color:var(--violet);border:1px solid #34D39966;box-shadow:0 0 22px #34D39933,inset 0 0 18px #34D39922;border-radius:14px;padding:16px;text-align:center;margin:10px 0;letter-spacing:.08em;text-shadow:0 0 10px #34D399}
.center{text-align:center}.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avatar{font-size:28px;border:1.5px solid var(--line);border-radius:14px;background:#21423A;width:56px;height:56px;cursor:pointer;transition:all .15s}
.avatar.on{border-color:var(--violet);background:#34D3991f;box-shadow:0 0 18px #34D39955;transform:scale(1.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#21423A;border:1px solid #34D39966;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;box-shadow:0 0 30px #34D39944;max-width:92vw;text-align:center}
.hide{display:none!important}
.check{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#21423A;border:1px solid var(--line);margin:8px 0;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;flex:none;accent-color:var(--teal)}
.timer{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}.timer.warn{color:var(--coral)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.matrix div{border-radius:14px;padding:12px;font-size:14px;color:#183229}
.matrix b{display:block;font-size:13px;margin-bottom:4px;letter-spacing:.04em}
.prompt{background:#21423A;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.ring{width:124px;height:124px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto;box-shadow:0 0 28px #6EE7B744}
.ring span{background:#1B372F;width:98px;height:98px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:700;font-size:26px;color:#fff!important}
.ring small{font-size:11px;color:var(--muted);font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
td input{padding:7px;text-align:center;font-size:15px;width:62px}
td.name input{width:150px;text-align:left}
.lb{display:grid;grid-template-columns:56px 1fr 110px;align-items:center;gap:14px;background:linear-gradient(90deg,#24473D,#1E3B33);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin:10px 0;opacity:0;transform:translateY(12px);transition:all .5s}
.lb.show{opacity:1;transform:none}
.lb .rk{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:#ffffff12;color:#fff}
.lb .nm{font-weight:700;font-size:20px;color:#fff}.lb .xp{font-weight:700;font-size:22px;text-align:right;color:var(--violet);text-shadow:0 0 12px #34D39988}
.lb .barw{height:8px;border-radius:9px;background:#ffffff12;margin-top:8px;overflow:hidden}.lb .barw div{height:100%;background:linear-gradient(90deg,#1F7A5A,#34D399,#C0C8CC);width:0;transition:width 1s .3s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:380px;margin-top:20px}
.step{width:30%;max-width:250px;border-radius:20px 20px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:18px;color:#183229;opacity:0;transform:translateY(40px);transition:all .8s}
.step.show{opacity:1;transform:none}
.step .medal{font-size:54px}.step .n2{font-weight:700;font-size:22px;text-align:center;padding:6px 10px}.step .pp{font-weight:700;font-size:16px;opacity:.85}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;background:#ffffff0a;color:#fff;font:inherit;font-weight:700;font-size:14px}
.pill.on{background:linear-gradient(135deg,#34D399,#C0C8CC);color:#183229;border-color:transparent;box-shadow:0 0 18px #34D39955}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#ffffff14;padding:2px 6px;border-radius:6px}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dealtable th,.dealtable td{font-size:13px;padding:8px 5px}.dealtable td.best{color:#6EE7B7;font-weight:700;text-shadow:0 0 10px #6EE7B788}
.brief{border-radius:16px;padding:16px;margin:14px 0;border:1px solid #34D39955;background:linear-gradient(135deg,#34D39914,#C0C8CC14);line-height:1.55}
.vs{font-size:26px;font-weight:700;text-align:center;margin:6px 0;background:linear-gradient(90deg,#34D399,#C0C8CC);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<div id="toast" class="toast hide"></div>
<script>
"use strict";
/* ENGAGE QUEST: Robbins, Coulter & Long (2025) Ch.13, 14, 16; Mullins & Rees (2023) Ch.7. Fictional company: Pulse. */
const mem = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let S = store.get("eq3_pair", { team: "", pair: 0, avatar: "🐉", xp: {}, done: {}, unlocked: {}, sound: true, data: {} });
let HOST = store.get("eq3_host", null);
const save = () => store.set("eq3_pair", S), saveHost = () => store.set("eq3_host", HOST);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m, ms = 2200) { const t = $("#toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hide"), ms); }
let timers = []; function stopTimers() { timers.forEach(clearInterval); timers = []; }
function view(h) { stopTimers(); $("#app").innerHTML = h; window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function checksum(p, r, s) { const str = `EQ3|${p}|${r}|${s}|PULSE`; let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return A[h % 24] + A[Math.floor(h / 24) % 24]; }
const makeCode = (r, s) => `${S.pair}-${r}-${s}-${checksum(S.pair, r, s)}`;
function pop(t, col) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; if (col) d.style.color = col; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function countdown(el, secs, onEnd) { let left = secs; const draw = () => { if (!el) return; el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("warn", left <= 10); }; draw(); const id = setInterval(() => { left--; if (left <= 0) { left = 0; draw(); clearInterval(id); onEnd && onEnd(); } else draw(); }, 1000); timers.push(id); }
let AC = null;
function tone(seq) { if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime; seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * 0.75; }); } catch (e) {} }
const SFX = { good: () => tone([[784, .12], [1175, .22]]), streak: () => tone([[784, .1], [988, .1], [1319, .25]]), soft: () => tone([[392, .2], [349, .25]]), win: () => tone([[523, .12], [659, .12], [784, .12], [1047, .4]]), tap: () => tone([[1200, .05]]) };
function confetti(ms = 3000) { const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight; const cols = ["#34D399", "#6EE7B7", "#D7DEE0", "#F87171", "#C0C8CC"]; const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 3 + Math.random() * 5, c: cols[Math.floor(Math.random() * 5)], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 })); const end = Date.now() + ms; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .08; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.beginPath(); x.roundRect ? x.roundRect(-p.r, -p.r / 2, p.r * 2, p.r, 2) : x.rect(-p.r, -p.r / 2, p.r * 2, p.r); x.fill(); x.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(); }

// ============================================================ CHAPTERS
const SECTIONS = { A: "Section 1 · Organizational behaviour", B: "Section 2 · Motivation & reward", C: "Final challenges" };
const CH = [
  { id: 1, sec: "A", key: "ATTITUDE", title: "Read the People", sub: "OB goals, attitudes, engagement, attitude surveys", max: 100, ico: "🔍", col: "#34D399", ref: "RCL Ch.13", type: "quiz" },
  { id: 2, sec: "A", key: "PERCEPTION", title: "Inside Their Heads", sub: "Personality, perception, attribution, shaping", max: 100, ico: "🧠", col: "#C0C8CC", ref: "RCL Ch.13", type: "quiz" },
  { id: 3, sec: "B", key: "NEEDS", title: "What Drives Them", sub: "Content theories: Maslow, Herzberg, McClelland, ERG", max: 100, ico: "🔋", col: "#6EE7B7", ref: "RCL Ch.14 · M&R Ch.7", type: "quiz" },
  { id: 4, sec: "B", key: "EQUITY", title: "Fair Play", sub: "Contemporary theories: expectancy, equity, goals", max: 100, ico: "⚖️", col: "#D7DEE0", ref: "RCL Ch.14 · M&R Ch.7", type: "quiz" },
  { id: 5, sec: "B", key: "ENRICH", title: "Design the Job", sub: "Job design for today's workforce", max: 100, ico: "🛠️", col: "#A7F3D0", ref: "RCL Ch.14", type: "quiz" },
  { id: 6, sec: "B", key: "THRIVE", title: "Thrive at Work", sub: "Feedback, rewards beyond pay, well-being", max: 100, ico: "🌱", col: "#6EE7B7", ref: "RCL Ch.13, 14 · M&R Ch.7", type: "quiz" },
  { id: 7, sec: "C", key: "SIMULATE", title: "The Engagement Simulator", sub: "Run Pulse for a year · budget, events, results", max: 150, ico: "📈", col: "#6EE7B7", ref: "All readings", type: "sim" },
  { id: 8, sec: "C", key: "DEAL", title: "The Pay Talks", sub: "Pair vs pair negotiation", max: 150, ico: "🤝", col: "#C0C8CC", ref: "All readings", type: "duel" },
  { id: 9, sec: "C", key: "LIGHTNING", title: "Lightning Round", sub: "Bonus if time allows · 10 rapid-fire questions", max: 100, ico: "⚡", col: "#D7DEE0", ref: "All readings", type: "blitz" },
];
const TOTAL = CH.reduce((a, c) => a + c.max, 0);
const C = (id) => CH.find((x) => x.id === id);
const RANKS = [[0, "New Head of People"], [150, "People Partner"], [300, "Culture Builder"], [450, "Engagement Expert"], [600, "Talent Champion"], [750, "Chief People Officer"], [900, "Workplace Legend"]];
const rank = (xp) => RANKS.filter((r) => xp >= r[0]).pop()[1];
const totalXP = () => Object.values(S.xp).reduce((a, b) => a + b, 0);

/* Each question: f = face, n = who, s = situation ("" = concept check), q = question, o = options (FIRST = correct; shuffled at runtime), w = why */
const Q = {
1: [
  { f: "🧊", n: "Pulse's new CEO", s: "\"I can see our strategy, structure and policies. What am I missing?\"", q: "In the iceberg metaphor, which of these is a hidden aspect?", o: ["Attitudes and perceptions", "Strategies and objectives", "Policies and procedures", "The chain of command"], w: "Exhibit 13-1: visible aspects include strategies, structure and formal authority; hidden aspects include attitudes, perceptions, group norms, informal interactions and conflicts." },
  { f: "🧑‍🔧", n: "Leo, support team", s: "Leo often covers colleagues' shifts and trains new starters, although none of this is in his job description.", q: "What is Leo's behaviour called?", o: ["Organisational citizenship behaviour", "Job involvement in his own daily tasks", "Counterproductive workplace behaviour", "Employee productivity"], w: "OCB is discretionary behaviour that isn't part of formal job requirements but promotes the effective functioning of the organisation." },

// ============================================================ CHAPTER TIMERS (minutes of play per chapter)
const LIMIT = { 1: 6, 2: 6, 3: 6, 4: 6, 5: 6, 6: 6, 7: 15, 8: 14, 9: 5 };
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function startChTimer(id) { if (!S.data["t" + id]) { S.data["t" + id] = Date.now(); save(); } runChTimer(id); }
function chLeft(id) { return Math.max(0, Math.round(LIMIT[id] * 60 - (Date.now() - S.data["t" + id]) / 1000)); }
function runChTimer(id) {
  clearInterval(window._cht); let warned = false;
  const tick = () => {
    if (S.done[id]) return clearInterval(window._cht);
    const left = chLeft(id), el = $("#cht");
    if (el) { el.textContent = "⏱ " + fmt(left); el.style.color = left <= 60 ? "var(--coral)" : ""; }
    if (left <= 60 && left > 0 && !warned) { warned = true; toast("⏰ 1 minute left in this chapter!"); }
    if (left <= 0) { clearInterval(window._cht); timeUp(id); }
  };
  tick(); window._cht = setInterval(tick, 1000);
}
function timeUp(id) {
  if (C(id).type === "quiz" && B && B.id === id) { const xp = B.xp, line = `⏰ Time's up! ${B.correct} correct before the bell · best streak ${B.best} 🔥`; S.data["rev" + id] = B.rev.join(""); B = null; finish(id, xp, line); }
  else toast("⏰ Time's up! Finish this chapter now.", 4000);
}
const timerChip = () => `<span class="chip" id="cht" style="font-variant-numeric:tabular-nums">⏱</span>`;

// ============================================================ ROUTER + SCREENS
function route() { const h = location.hash.replace("#", ""); if (h === "host") return HOST ? hostBoard() : hostSetup(); if (!S.team || !S.pair) return setup(); home(); }
window.addEventListener("hashchange", route);
function go(h) { if (location.hash === "#" + h) route(); else location.hash = h; }
const topBar = (back = true) => `<div class="top">${back ? `<button class="btn ghost small" onclick="go('play')">← Chapters</button>` : `<span class="brand">ENGAGE QUEST</span>`}
  <div class="row"><span class="chip">👥 Pair ${S.pair}</span><span class="chip">⭐ ${totalXP()} XP</span><span class="chip" style="cursor:pointer" onclick="toggleSound(this)">${S.sound ? "🔊" : "🔇"}</span></div></div>`;
function toggleSound(el) { S.sound = !S.sound; save(); el.textContent = S.sound ? "🔊" : "🔇"; }

    ${CH.map((c, i) => { const open = S.unlocked[c.id], done = S.done[c.id];

function openCh(id) {
  const c = C(id); SFX.tap();
  if (S.done[id]) return result(id);
  if (!S.unlocked[id]) {
    view(`<div class="wrap">${topBar()}<div class="card" style="margin-top:20px"><div class="ico" style="font-size:40px">${c.ico}</div><h2>Chapter ${id}: ${c.title}</h2><p class="muted">Enter the code word shown on the slide.</p>
      <input id="code" autocomplete="off" autocapitalize="characters" placeholder="CODE WORD" onkeydown="if(event.key==='Enter')tryUnlock(${id})"><button class="btn block" style="margin-top:12px" onclick="tryUnlock(${id})">Unlock chapter</button></div></div>`);
    setTimeout(() => $("#code") && $("#code").focus(), 50); return;
  }
  ({ quiz: quizIntro, sim, blitz, duel })[c.type](id);
}
function tryUnlock(id) { const i = $("#code"); if (i.value.trim().toUpperCase() === C(id).key) { S.unlocked[id] = true; save(); SFX.win(); toast("Chapter unlocked 🔓"); openCh(id); } else { i.classList.add("shake"); setTimeout(() => i.classList.remove("shake"), 400); toast("Not quite: check the slide"); } }
function finish(id, xp, line) { clearInterval(window._cht); S.xp[id] = xp; S.done[id] = true; S.data["line" + id] = line || ""; save(); if (xp >= C(id).max * 0.7) { SFX.win(); confetti(2500); } result(id); }
function result(id) {
  const c = C(id), xp = S.xp[id], pct = xp / c.max;
  view(`<div class="wrap">${topBar()}<div class="hero center" style="margin-top:14px"><div style="font-size:44px">${c.ico}</div>
    <h2 style="color:#fff">${pct >= .85 ? "Outstanding!" : pct >= .6 ? "Chapter complete: well done!" : "Chapter complete: keep going!"}</h2>
    <div class="big">${xp}<span style="font-size:22px;opacity:.8"> / ${c.max} XP</span></div>${S.data["line" + id] ? `<p>${S.data["line" + id]}</p>` : ""}</div>
    <div class="card center"><div class="muted">Your score code: show it to your lecturer</div><div class="code">${makeCode(id, xp)}</div></div>
    ${S.data["rev" + id] ? `<div class="card"><h3>Review</h3>${S.data["rev" + id]}</div>` : ""}
    <button class="btn block" onclick="go('play')">Back to chapters</button></div>`);
}

  S.data.rev8 = `<p><b>The hidden structure</b></p><p>🔁 <b>Pay</b> mattered most to the HR Director (cost), while <b>flexible working</b> mattered most to the Employee Rep: the best deals kept the pay rise modest and gave real flexibility.</p>
    <p>🤝 A <b>team bonus</b> and <b>monthly peer recognition</b> worked well for BOTH sides: win-wins if you asked about them.</p><p>⚖️ The <b>learning budget</b> was a pure tug-of-war: every euro one side gained, the other lost.</p>
    <p>🧠 The link to theory: each side's <b>valence</b> was different (expectancy theory), and pay is a hygiene factor while flexibility and recognition can motivate (Herzberg).</p>
    <p>💡 Pairs who asked questions and shared priorities usually found more value than pairs who only argued positions.</p>`;
  finish(8, xp, `Your role: <b>${DEAL.role[d.side]}</b> · Deal value ${raw}/${max}${none ? "" : " + 30 deal bonus"}<br>Deal code: <b class="kbd">${code}</b> (must match your rival pair's)`);
}

// ============================================================ HQ
function hostSetup() {
  view(`<div class="wrap"><div class="hero" style="margin-top:10px"><div class="chip dark">Lecturer HQ</div><h1 style="margin-top:12px">Engage Quest</h1><p>Create a scoreboard for today's class.</p></div>
    <div class="card"><label for="np">Number of pairs</label><select id="np">${[4, 5, 6, 7, 8, 9, 10].map((n) => `<option ${n === 7 ? "selected" : ""}>${n}</option>`).join("")}</select>
    <p class="muted">Scores are saved on this device only. Project this screen for the class.</p><button class="btn block" onclick="hostCreate()">Create scoreboard</button></div>
    <p class="center"><a href="#play" style="color:var(--violet);font-weight:700">← Player app</a></p></div>`);
}
function hostCreate() { HOST = { pairs: Array.from({ length: +$("#np").value }, (_, i) => ({ name: `Pair ${i + 1}`, s: {} })), tab: "scores" }; saveHost(); hostBoard(); }
const hTotal = (p) => CH.reduce((a, c) => a + (+p.s[c.id] || 0), 0);
function hostBoard() {
  const t = HOST.tab || "scores";
  view(`<div class="wrap wide"><div class="top"><span class="brand">ENGAGE QUEST · HQ</span><a href="#play" style="color:var(--violet);font-weight:700;font-size:14px">Player app</a></div>
    <div class="tabs">${[["scores", "✏️ Scores"], ["board", "📊 Leaderboard"], ["podium", "🏆 Podium"], ["reset", "⚙️ Reset"]].map(([k, l]) => `<button class="pill ${t === k ? "on" : ""}" onclick="hostTab('${k}')">${l}</button>`).join("")}</div><div id="hb"></div></div>`);
  ({ scores: hScores, board: hBoard, podium: hPodium, reset: hReset })[t]();
}
function hostTab(t) { HOST.tab = t; saveHost(); hostBoard(); }
function hScores() {
  $("#hb").innerHTML = `<div class="card"><label for="sc">Type a score code (e.g. <span class="kbd">3-2-84-KQ</span>) and press Enter</label>
    <div class="row"><input id="sc" style="max-width:300px" placeholder="pair-chapter-xp-XX" onkeydown="if(event.key==='Enter')hostCode()"><button class="btn small" onclick="hostCode()">Add</button><span class="muted" id="msg">${HOST._msg || ""}</span></div></div>
    <div class="card" style="overflow-x:auto"><table><tr><th>#</th><th style="text-align:left">Team</th>${CH.map((c) => `<th title="${c.title}">Ch${c.id}<br>/${c.max}</th>`).join("")}<th>Total</th></tr>
    ${HOST.pairs.map((p, i) => `<tr><td>${i + 1}</td><td class="name"><input value="${esc(p.name)}" onchange="hostName(${i},this.value)"></td>${CH.map((c) => `<td><input inputmode="numeric" value="${p.s[c.id] ?? ""}" onchange="hostSet(${i},${c.id},this.value)"></td>`).join("")}<td><b id="tot${i}">${hTotal(p)}</b></td></tr>`).join("")}</table>
    <p class="muted">Every chapter is scored in the app. You can type or override any score, e.g. bonus XP for a great contribution.</p></div>`;
}
function hostName(i, v) { HOST.pairs[i].name = v.trim() || `Pair ${i + 1}`; saveHost(); }
function hostSet(i, id, v) { const n = v === "" ? undefined : Math.max(0, Math.min(C(id).max, Math.round(+v || 0))); if (n === undefined) delete HOST.pairs[i].s[id]; else HOST.pairs[i].s[id] = n; saveHost(); const e = $("#tot" + i); if (e) e.textContent = hTotal(HOST.pairs[i]); }
function hostCode() {
  const m = $("#sc").value.trim().toUpperCase().match(/^(\d+)-(\d+)-(\d+)-([A-Z]{2})$/);
  if (!m) { $("#msg").textContent = "❌ Format: pair-chapter-xp-XX"; return; }
  const [, p, r, s, c] = m, pi = +p - 1;
  if (!HOST.pairs[pi] || !C(+r)) { $("#msg").textContent = "❌ Unknown pair or chapter"; return; }
  if (checksum(+p, +r, +s) !== c) { $("#msg").textContent = "⚠️ This code doesn't verify"; return; }
  hostSet(pi, +r, s); HOST._msg = `✅ ${HOST.pairs[pi].name}: Chapter ${r} = ${s} XP`; hScores(); setTimeout(() => $("#sc") && $("#sc").focus(), 30);
}
const ranked = () => HOST.pairs.map((p) => ({ ...p, total: hTotal(p) })).sort((a, b) => b.total - a.total);
function hBoard() {
  const rk = ranked(), max = Math.max(1, ...rk.map((p) => p.total));
  $("#hb").innerHTML = `<h1 class="center">Leaderboard</h1>${rk.map((p, k) => `<div class="lb"><div class="rk" style="${k < 3 ? `background:${["#D7DEE0", "#E3EBE8", "#A3E635"][k]};color:#183229` : ""}">${k + 1}</div>
    <div><div class="nm">${esc(p.name)}</div><div class="barw"><div data-w="${(p.total / max) * 100}"></div></div></div><div class="xp">${p.total} XP</div></div>`).join("")}`;
  document.querySelectorAll(".lb").forEach((el, k) => setTimeout(() => { el.classList.add("show"); const b = el.querySelector(".barw div"); b.style.width = b.dataset.w + "%"; }, 100 + k * 120));
}
function hPodium() {
  $("#hb").innerHTML = `<div class="center"><h1>🏆 Engagement Champions</h1><button class="btn" id="rv" onclick="reveal()">Reveal 3rd place</button></div>
    <div class="podium"><div class="step" id="p2" style="height:240px;background:linear-gradient(180deg,#C0C8CC,#1F7A5A)"></div><div class="step" id="p1" style="height:320px;background:linear-gradient(180deg,#34D399,#0F766E)"></div><div class="step" id="p3" style="height:180px;background:linear-gradient(180deg,#C0C8CC,#7C8A87)"></div></div>`;
  HOST._rv = 0;
}
function reveal() {
  const rk = ranked(), place = [3, 2, 1][HOST._rv]; if (!place) return; const p = rk[place - 1], el = $("#p" + place);
  if (p) { el.innerHTML = `<div class="medal">${["🥇", "🥈", "🥉"][place - 1]}</div><div class="n2">${esc(p.name)}</div><div class="pp">${p.total} XP</div>`; el.classList.add("show"); }
  HOST._rv++; const b = $("#rv");
  if (HOST._rv === 1) { b.textContent = "Reveal 2nd place"; SFX.good(); confetti(1000); } else if (HOST._rv === 2) { b.textContent = "Reveal the winners 🥁"; SFX.good(); confetti(1000); } else { b.textContent = "Congratulations! 🎉"; b.disabled = true; SFX.win(); confetti(6000); }
}
function hReset() { $("#hb").innerHTML = `<div class="card"><h3>Start a new game</h3><p>Clears all scores on this device.</p><button class="btn coral" onclick="this.classList.add('hide');this.nextElementSibling.classList.remove('hide')">Clear scoreboard…</button><button class="btn coral hide" onclick="HOST=null;saveHost();hostSetup()">Yes, clear everything</button></div>`; }
route();
</script>
</body>
</html>
