<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E1B4B">
<title>Leadership Quest: Your First Year as a Leader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--indigo:#1E1B4B;--ink:#16142F;--violet:#7C5CFF;--violet2:#A78BFA;--teal:#22C1A6;--amber:#FFB547;--coral:#FF6B81;--blue:#4DA3FF;--muted:#6B6F8A;--bg:#F4F3FF;--card:#fff;--line:#E6E4F5}
*{box-sizing:border-box}
html,body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#B9A7FF55,transparent),radial-gradient(900px 500px at 110% 10%,#7FE3D355,transparent),var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 100px}
.wide{max-width:1200px}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:.2em 0 .3em}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:.3em 0 .5em}
h3{font-size:18px;font-weight:700;margin:.2em 0 .5em}
p{line-height:1.55}
.card{background:var(--card);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 10px 30px #1E1B4B12,0 1px 2px #1E1B4B10}
.hero{background:linear-gradient(135deg,#1E1B4B,#4B3CC9 60%,#7C5CFF);color:#fff;border-radius:26px;padding:22px;box-shadow:0 18px 40px #4B3CC955}
.hero p{color:#E4E0FF}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--violet);color:#fff;margin:6px 6px 6px 0;box-shadow:0 8px 18px #7C5CFF44;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:#fff;color:var(--indigo);box-shadow:0 2px 8px #1E1B4B14;border:1px solid var(--line)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn.teal{background:var(--teal);box-shadow:0 8px 18px #22C1A644}
.btn.coral{background:var(--coral);box-shadow:0 8px 18px #FF6B8144}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:12px 13px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--violet)}
label{font-weight:700;font-size:14px;display:block;margin:14px 0 6px;color:var(--indigo)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;background:#fff;box-shadow:0 2px 8px #1E1B4B12}
.chip.dark{background:#ffffff22;color:#fff;box-shadow:none}
.brand{font-weight:800;font-size:14px;color:var(--violet);letter-spacing:.02em}
.chapter{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;margin:10px 0;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;background:#fff;box-shadow:0 8px 24px #1E1B4B10;transition:transform .12s}
.chapter:hover{transform:translateY(-2px)}
.chapter .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.chapter .t{font-weight:800;font-size:16px}
.chapter .s{font-size:13px;color:var(--muted);margin-top:2px}
.chapter .pts{margin-left:auto;font-weight:800;font-size:13px;white-space:nowrap;text-align:right;color:var(--muted)}
.chapter.locked{opacity:.6}
.chapter.done .pts{color:var(--teal)}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:16px;padding:14px;margin:10px 0;font:inherit;font-size:16px;cursor:pointer;transition:all .15s;line-height:1.45}
.opt:hover{border-color:var(--violet2);transform:translateX(2px)}
.opt .k{width:28px;height:28px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;color:var(--violet)}
.opt.right{border-color:var(--teal);background:#E6FAF6}.opt.right .k{background:var(--teal);color:#fff}
.opt.wrong{border-color:var(--coral);background:#FFF0F2}.opt.wrong .k{background:var(--coral);color:#fff}
.opt.gone{opacity:.25;pointer-events:none}
.scene{display:flex;gap:12px;align-items:flex-start}
.face{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#EDE9FF,#D9F5EF);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.scene .who{font-size:13px;font-weight:700;color:var(--violet)}
.scene .txt{font-size:17px;line-height:1.5;margin-top:2px}
.ask{font-weight:800;font-size:17px;margin:14px 0 4px;color:var(--indigo)}
.sheet{border-radius:18px;padding:14px 16px;margin-top:12px;animation:rise .3s ease}
.sheet.ok{background:#E6FAF6;border:1.5px solid #A7EBDD}.sheet.no{background:#FFF5E6;border:1.5px solid #FFDCA8}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.bar{height:10px;border-radius:99px;background:#E6E4F5;overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),var(--teal));transition:width .5s}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#E2582E}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-weight:800;font-size:26px;color:var(--violet);pointer-events:none;animation:pop 1s forwards;z-index:60;text-shadow:0 4px 16px #fff}
@keyframes pop{0%{transform:translate(-50%,10px) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{transform:translate(-50%,-70px);opacity:0}}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;background:var(--indigo);color:#fff;border-radius:16px;padding:16px;text-align:center;margin:10px 0;letter-spacing:.06em}
.center{text-align:center}.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.avatar{font-size:28px;border:2px solid var(--line);border-radius:16px;background:#fff;width:56px;height:56px;cursor:pointer;transition:all .15s}
.avatar.on{border-color:var(--violet);background:#EDE9FF;transform:scale(1.06)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--indigo);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:70;box-shadow:0 10px 30px #1E1B4B44;max-width:92vw;text-align:center}
.hide{display:none!important}
.check{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg);margin:8px 0;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;flex:none;accent-color:var(--violet)}
.timer{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}.timer.warn{color:var(--coral)}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.matrix div{border-radius:16px;padding:12px;font-size:14px;color:#fff}
.matrix b{display:block;font-size:13px;margin-bottom:4px;letter-spacing:.04em}
.prompt{background:var(--bg);border-radius:12px;padding:10px 12px;margin:6px 0}
.ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:6px auto}
.ring span{background:#fff;width:94px;height:94px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:800;font-size:24px}
.ring small{font-size:11px;color:var(--muted);font-weight:700}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td input{padding:7px;text-align:center;font-size:15px;width:62px}
td.name input{width:150px;text-align:left}
.lb{display:grid;grid-template-columns:56px 1fr 110px;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 18px;margin:10px 0;box-shadow:0 8px 24px #1E1B4B10;opacity:0;transform:translateY(12px);transition:all .5s}
.lb.show{opacity:1;transform:none}
.lb .rk{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;background:var(--bg);color:var(--indigo)}
.lb .nm{font-weight:800;font-size:20px}.lb .xp{font-weight:800;font-size:22px;text-align:right;color:var(--violet)}
.lb .barw{height:8px;border-radius:9px;background:var(--bg);margin-top:8px;overflow:hidden}.lb .barw div{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));width:0;transition:width 1s .3s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;min-height:380px;margin-top:20px}
.step{width:30%;max-width:250px;border-radius:24px 24px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:18px;color:#fff;opacity:0;transform:translateY(40px);transition:all .8s}
.step.show{opacity:1;transform:none}
.step .medal{font-size:54px}.step .n2{font-weight:800;font-size:22px;text-align:center;padding:6px 10px}.step .pp{font-weight:700;font-size:16px;opacity:.9}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;background:#fff;color:var(--indigo);font:inherit;font-weight:700;font-size:14px}
.pill.on{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:2px 6px;border-radius:6px}
.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>

<script>
"use strict";
/* LEADERSHIP QUEST v2: Robbins, Coulter & Long (16th global edn) Ch.14, 16, 17; Mullins & Rees (13th edn) Ch.9; Ibarra & Scoular (2019). */
const mem = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let S = store.get("lq2_pair", { team: "", pair: 0, avatar: "🦊", xp: {}, done: {}, unlocked: {}, hints: 3, sound: true, data: {} });
let HOST = store.get("lq2_host", null);
const save = () => store.set("lq2_pair", S), saveHost = () => store.set("lq2_host", HOST);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m, ms = 2200) { const t = $("#toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hide"), ms); }
let timers = []; function stopTimers() { timers.forEach(clearInterval); timers = []; }
function view(h) { stopTimers(); $("#app").innerHTML = h; window.scrollTo(0, 0); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function checksum(p, r, s) { const str = `LQ2|${p}|${r}|${s}|LEAD`; let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return A[h % 24] + A[Math.floor(h / 24) % 24]; }
const makeCode = (r, s) => `${S.pair}-${r}-${s}-${checksum(S.pair, r, s)}`;
function pop(t, col) { const d = document.createElement("div"); d.className = "pop"; d.textContent = t; if (col) d.style.color = col; document.body.appendChild(d); setTimeout(() => d.remove(), 1000); }
function countdown(el, secs, onEnd) { let left = secs; const draw = () => { if (!el) return; el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.classList.toggle("warn", left <= 10); }; draw(); const id = setInterval(() => { left--; if (left <= 0) { left = 0; draw(); clearInterval(id); onEnd && onEnd(); } else draw(); }, 1000); timers.push(id); }
let AC = null;
function tone(seq) { if (!S.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime; seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d); t += d * 0.75; }); } catch (e) {} }
const SFX = { good: () => tone([[784, .12], [1175, .22]]), streak: () => tone([[784, .1], [988, .1], [1319, .25]]), soft: () => tone([[392, .2], [349, .25]]), win: () => tone([[523, .12], [659, .12], [784, .12], [1047, .4]]), tap: () => tone([[1200, .05]]) };
function confetti(ms = 3000) { const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight; const cols = ["#7C5CFF", "#22C1A6", "#FFB547", "#FF6B81", "#4DA3FF"]; const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 3 + Math.random() * 5, c: cols[Math.floor(Math.random() * 5)], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 })); const end = Date.now() + ms; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .08; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.beginPath(); x.roundRect ? x.roundRect(-p.r, -p.r / 2, p.r * 2, p.r, 2) : x.rect(-p.r, -p.r / 2, p.r * 2, p.r); x.fill(); x.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(); }

// ============================================================ CHAPTERS
const CH = [
  { id: 1, key: "START", title: "Day One", sub: "Leading vs managing · trait theories", max: 100, ico: "☀️", col: "#FFB547", ref: "RCL Ch.16 · M&R Ch.9", type: "quiz" },
  { id: 2, key: "STYLE", title: "Finding Your Style", sub: "Behavioural theories", max: 100, ico: "🎨", col: "#4DA3FF", ref: "RCL Ch.16", type: "quiz" },
  { id: 3, key: "READY", title: "Read the Room", sub: "Contingency theories · power", max: 100, ico: "🧭", col: "#22C1A6", ref: "RCL Ch.16 · M&R Ch.9", type: "quiz" },
  { id: 4, key: "VISION", title: "Inspire the Team", sub: "Transactional vs transformational · LMX", max: 100, ico: "🚀", col: "#7C5CFF", ref: "RCL Ch.16 · M&R Ch.9", type: "quiz" },
  { id: 5, key: "INTEGRITY", title: "The Right Thing", sub: "Authentic & ethical leadership · trust", max: 100, ico: "⚖️", col: "#FF6B81", ref: "RCL Ch.16", type: "quiz" },
  { id: 6, key: "GROW", title: "Coach, Don't Tell", sub: "The leader as coach · live practice", max: 150, ico: "🎯", col: "#FFB547", ref: "Ibarra & Scoular (2019)", type: "dojo" },
  { id: 7, key: "REMOTE", title: "Team Without Walls", sub: "Digital leadership · remote teams", max: 100, ico: "🌍", col: "#4DA3FF", ref: "RCL Ch.14 & 17", type: "quiz" },
  { id: 8, key: "GENERATIONS", title: "Four Generations, One Team", sub: "Generational expectations", max: 100, ico: "👥", col: "#22C1A6", ref: "RCL Ch.14 & 16", type: "quiz" },
  { id: 9, key: "CRISIS", title: "The Crisis", sub: "Final challenge · leading through uncertainty", max: 150, ico: "⚡", col: "#FF6B81", ref: "All readings", type: "boss" },
];
const TOTAL = CH.reduce((a, c) => a + c.max, 0);
const C = (id) => CH.find((x) => x.id === id);
const RANKS = [[0, "New Team Lead"], [150, "Rising Leader"], [300, "Trusted Manager"], [450, "Senior Manager"], [600, "Director"], [750, "Vice President"], [900, "Chief Executive"]];
const rank = (xp) => RANKS.filter((r) => xp >= r[0]).pop()[1];
const totalXP = () => Object.values(S.xp).reduce((a, b) => a + b, 0);
const AVATARS = ["🦊", "🐼", "🦉", "🐯", "🐙", "🦄", "🐸", "🐧", "🦁", "🐨"];

/* Each question: who (face, name), s = situation, q = the question, o = options (FIRST = correct; shuffled at runtime), w = why */
const Q = {
1: [
  { f: "👩‍💼", n: "Dana, your director", s: "\"Congratulations on the promotion! I don't need another manager on this team. I need a leader.\"", q: "What is Dana most likely asking you to do?", o: ["Set a direction and influence people to commit to it", "Produce more detailed budgets and schedules", "Use your new formal authority more firmly", "Work longer hours than your team"], w: "Leadership = influencing a group towards goals. Planning, budgeting and control are managing. Ideally, every manager is also a leader (RCL Ch.16)." },
  { f: "📊", n: "Monday morning", s: "You spend three hours building the Q3 budget, the staff rota and the project schedule.", q: "Which part of your role is this mainly?", o: ["Managing: planning and organising resources", "Leading: inspiring people to change", "Transformational leadership", "Coaching"], w: "Planning and organising are core management functions. Necessary, but not the same as leading." },
  { f: "😟", n: "Your team", s: "The team is anxious about a new product strategy. You run a session explaining why it matters, what it means for each person, and how you'll support them.", q: "What are you mainly doing?", o: ["Leading: influencing people towards a goal", "Controlling: checking performance against standards", "Organising: designing job roles", "Budgeting"], w: "Explaining 'why' and gaining commitment is leadership in action." },
  { f: "🧑‍💼", n: "HR partner", s: "\"Let's make Alex team lead. He's tall, confident and just LOOKS like a leader.\"", q: "Which leadership approach is HR relying on?", o: ["Trait theory", "Path-goal theory", "Leader-member exchange (LMX)", "Situational leadership"], w: "Trait theories look for personal characteristics that set leaders apart." },
  { f: "🤔", n: "You", s: "You want to push back on HR's reasoning politely, but with evidence.", q: "What's the strongest argument?", o: ["Traits alone don't predict effectiveness: behaviour and the situation matter too", "Confident people are always poor leaders", "Only intelligence predicts leadership", "Leadership can't be studied"], w: "Research found traits help but can't explain effectiveness on their own, which is why researchers moved on to behaviours and situations." },
  { f: "📋", n: "HR partner", s: "\"Fine. Then which traits HAVE been linked with leadership?\"", q: "Your best answer:", o: ["Drive, honesty and integrity, self-confidence, intelligence", "Height, age and accent", "Introversion, caution and perfectionism only", "None. Traits are irrelevant"], w: "RCL Ch.16 lists traits such as drive, the desire to lead, honesty and integrity, self-confidence, intelligence and job-relevant knowledge." },
  { f: "👩‍💼", n: "Dana", s: "\"So, should ALL our managers also be leaders?\"", q: "What does the textbook view suggest?", o: ["Ideally yes: managers need to influence, not only plan and control", "No, leading is HR's job", "Only senior managers need to lead", "Only if they have charisma"], w: "RCL: ideally, all managers should be leaders." },
  { f: "🎓", n: "A new intern", s: "\"What actually IS leadership? Is it just being the boss?\"", q: "Best definition to give them:", o: ["The process of leading a group and influencing it to achieve its goals", "Having the highest job title", "Controlling people through rules", "Being the most popular person"], w: "RCL Ch.16 definition. Leadership is about influence, not just position." },
],
2: [
  { f: "🧔", n: "Marc, team lead next door", s: "Marc decides everything himself, tells people exactly how to do each task and rarely asks for input.", q: "Which style from the University of Iowa studies is this?", o: ["Autocratic", "Democratic", "Laissez-faire", "Transformational"], w: "Iowa: autocratic = centralised authority, dictated methods, limited participation." },
  { f: "🗳️", n: "Your project kick-off", s: "You ask the team to help decide how to split the project, delegate tasks and use their feedback to coach them.", q: "Which Iowa style are you using?", o: ["Democratic", "Autocratic", "Laissez-faire", "Directive"], w: "Iowa: democratic = involving employees, delegating, using feedback to coach." },
  { f: "🏖️", n: "Priya, another team lead", s: "Priya hands her team the brief and says, \"Do it however you like, see you in three weeks.\"", q: "Which style is this?", o: ["Laissez-faire", "Democratic", "Autocratic", "Participative"], w: "Iowa: laissez-faire = complete freedom to decide and complete the work." },
  { f: "🗂️", n: "You", s: "You publish a clear plan with each person's role, tasks and deadlines.", q: "Which Ohio State dimension is this?", o: ["Initiating structure", "Consideration", "Employee orientation", "Individualised consideration"], w: "Initiating structure = defining roles and tasks (task focus)." },

  $("#hb").innerHTML = `<h1 class="center">Leaderboard</h1>${rk.map((p, k) => `<div class="lb"><div class="rk" style="${k < 3 ? `background:${["#FFB547", "#A7B4C9", "#E39B6B"][k]};color:#fff` : ""}">${k + 1}</div>
    <div><div class="nm">${esc(p.name)}</div><div class="barw"><div data-w="${(p.total / max) * 100}"></div></div></div><div class="xp">${p.total} XP</div></div>`).join("")}`;
  document.querySelectorAll(".lb").forEach((el, k) => setTimeout(() => { el.classList.add("show"); const b = el.querySelector(".barw div"); b.style.width = b.dataset.w + "%"; }, 100 + k * 120));
}
function hPodium() {
  $("#hb").innerHTML = `<div class="center"><h1>🏆 Leaders of the Year</h1><button class="btn" id="rv" onclick="reveal()">Reveal 3rd place</button></div>
    <div class="podium"><div class="step" id="p2" style="height:240px;background:linear-gradient(180deg,#4DA3FF,#3477C4)"></div><div class="step" id="p1" style="height:320px;background:linear-gradient(180deg,#7C5CFF,#4B3CC9)"></div><div class="step" id="p3" style="height:180px;background:linear-gradient(180deg,#22C1A6,#178C79)"></div></div>`;
  HOST._rv = 0;
}
function reveal() {
  const rk = ranked(), place = [3, 2, 1][HOST._rv]; if (!place) return; const p = rk[place - 1], el = $("#p" + place);
  if (p) { el.innerHTML = `<div class="medal">${["🥇", "🥈", "🥉"][place - 1]}</div><div class="n2">${esc(p.name)}</div><div class="pp">${p.total} XP</div>`; el.classList.add("show"); }
  HOST._rv++; const b = $("#rv");
  if (HOST._rv === 1) { b.textContent = "Reveal 2nd place"; SFX.good(); confetti(1000); } else if (HOST._rv === 2) { b.textContent = "Reveal the winners 🥁"; SFX.good(); confetti(1000); } else { b.textContent = "Congratulations! 🎉"; b.disabled = true; SFX.win(); confetti(6000); }
}
function hReset() { $("#hb").innerHTML = `<div class="card"><h3>Start a new game</h3><p>Clears all scores on this device.</p><button class="btn coral" onclick="this.classList.add('hide');this.nextElementSibling.classList.remove('hide')">Clear scoreboard…</button><button class="btn coral hide" onclick="HOST=null;saveHost();hostSetup()">Yes, clear everything</button></div>`; }
route();
</script>
</body>
