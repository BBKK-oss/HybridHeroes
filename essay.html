<style>

.step.show{opacity:1;transform:none}
.step .medal{font-size:54px}.step .n2{font-weight:700;font-size:22px;text-align:center;padding:6px 10px}.step .pp{font-weight:700;font-size:16px;opacity:.85}

.shake{animation:shake .35s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dealtable th,.dealtable td{font-size:13px;padding:8px 5px}.dealtable td.best{color:#6EE7B7;font-weight:700;text-shadow:0 0 10px #6EE7B788}
.brief{border-radius:16px;padding:16px;margin:14px 0;border:1px solid #34D39955;background:linear-gradient(135deg,#34D39914,#C0C8CC14);line-height:1.55}
.vs{font-size:26px;font-weight:700;text-align:center;margin:6px 0;background:linear-gradient(90deg,#34D399,#C0C8CC);-webkit-background-clip:text;background-clip:text;color:transparent}

<div id="app"></div><div id="toast" class="toast hide"></div><canvas id="confetti"></canvas>
<script>
/* ENGAGEMENT ESSAY LAB: individual practice essay with automatic, rule-based marking.
   Readings: Robbins, Coulter & Long (2025) Ch.13, 14, 16; Mullins & Rees (2023) Ch.7. Case: Lighthouse Hotels (fictional). */
const mem = {};
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return mem[k] !== undefined ? mem[k] : d; } }, set(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const KEY = "ee1_essay";
let E = store.get(KEY, { name: "", started: 0, a: "", b: "", done: false, res: null });
const save = () => store.set(KEY, E);
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(m, ms = 2600) { const t = $("#toast"); t.textContent = m; t.classList.remove("hide"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add("hide"), ms); }
function view(h) { clearInterval(window._tick); $("#app").innerHTML = h; window.scrollTo(0, 0); }
const LIMIT = 30 * 60;
const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
const words = (t) => (t.trim().match(/[A-Za-zÀ-ÿ0-9%€£'’-]+/g) || []).length;
function checksum(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } const A = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return A[h % 24] + A[Math.floor(h / 24) % 24]; }
const markCode = (m, w) => `E-${m}-${w}-${checksum(`EE1|${m}|${w}|ESSAY`)}`;
function confetti(ms = 2500) { const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight; const cols = ["#34D399", "#6EE7B7", "#D7DEE0", "#F87171", "#C0C8CC"]; const P = Array.from({ length: 140 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, r: 3 + Math.random() * 5, c: cols[Math.floor(Math.random() * 5)], vy: 2 + Math.random() * 3.5, vx: -1.5 + Math.random() * 3, a: Math.random() * 6 })); const end = Date.now() + ms; (function f() { x.clearRect(0, 0, c.width, c.height); P.forEach(p => { p.y += p.vy; p.x += p.vx; p.a += .08; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); }); if (Date.now() < end) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })(); }

// ============================================================ THE CASE
const CASE = `
<p>Lighthouse Hotels runs six coastal hotels in Ireland and Scotland. In 2024 a private equity firm bought the group and appointed a new General Manager, <b>Tom Reilly</b>, to "professionalise" it.</p>
<h3>What changed in the last 12 months</h3>
<ul style="line-height:1.7;padding-left:20px">
<li>Reception, housekeeping and restaurant staff moved from fixed rotas to <b>zero-hours contracts</b>, with shifts announced weekly through an app.</li>
<li>Tom introduced a <b>points league</b>: guest review scores become points, and each month the top three employees get a €150 voucher.</li>
<li>Head Chef <b>Martina</b> (15 years with the group) lost control of her menus to a central <b>"standard menu"</b> designed in head office.</li>
<li>Front-desk staff are rated by <b>"mystery guests"</b> and receive their scores by email, with no conversation.</li>
<li>Housekeepers now clean <b>16 rooms per shift instead of 12</b>; the standard was set without consulting them.</li></ul>
<h3>Three voices from the staff survey</h3>
<div class="prompt"><b>Aoife, receptionist (2 years):</b> "I loved this job. Now I don't know my hours from one week to the next, and the voucher always goes to the same two people on the busiest desk."</div>
<div class="prompt"><b>Martina, Head Chef (15 years):</b> "I used to create. Now I just follow a laminated sheet. Why would I stay late anymore?"</div>
<div class="prompt"><b>Kasia, housekeeper (6 months):</b> "Nobody asked us about 16 rooms. My supervisor never says thank you, only tells us what we missed."</div>
<h3>Key figures</h3>
<table><tr><th style="text-align:left">Indicator</th><th>2023</th><th>2025</th></tr>
<tr><td style="text-align:left">Engaged employees</td><td>61%</td><td>34%</td></tr>
<tr><td style="text-align:left">Sick days per employee per year</td><td>4</td><td>9</td></tr>
<tr><td style="text-align:left">Staff leaving within 6 months</td><td>12%</td><td>38%</td></tr>
<tr><td style="text-align:left">Average guest review (out of 5)</td><td>4.6</td><td>4.1</td></tr></table>
<p style="margin-top:14px">Tom's response to the board: <i>"Staff are paid market rates and we have a reward scheme. Engagement is a personal attitude problem."</i></p>`;
const TASK_A = `<b>Task A (70%)</b>: Critically analyse why motivation and engagement at Lighthouse Hotels have collapsed. Draw on theories of individual behaviour, motivation and leadership, and use the three employees' experiences as evidence. Evaluate whether Tom's claim that engagement is "a personal attitude problem" is supported.`;
const TASK_B = `<b>Task B (30%)</b>: Recommend a realistic 12-month plan to rebuild motivation and engagement. Justify each action with theory and say how its success should be measured.`;

// ============================================================ MARKING MODEL
// fam: ib = individual behaviour (RCL Ch.13), ct = content theories, pt = process theories / job design, ld = leadership (RCL Ch.16)
const R = (s) => new RegExp(s, "i");
const CONCEPTS = [
  { id: "maslow", label: "Maslow's hierarchy of needs", fam: "ct", pts: 3, re: R("maslow|hierarchy of needs|safety needs?|esteem needs?|self-actuali[sz]ation|physiological needs?|social needs?|belonging"), sub: R("safety|security|esteem|belong|social need|physiological|self-actuali"), tip: "Zero-hours contracts threaten safety needs, which makes higher needs (esteem, self-actualisation) hard to reach." },
  { id: "herzberg", label: "Herzberg's two-factor theory", fam: "ct", pts: 3, re: R("herzberg|two[- ]factor|hygiene|motivators?\\b|motivating factors?"), sub2: [R("hygiene"), R("motivators?\\b|motivating factors?")], tip: "Pay and the voucher are hygiene factors; recognition, responsibility and the work itself (Martina's creativity) are the missing motivators." },
  { id: "mcclelland", label: "McClelland's needs theory", fam: "ct", pts: 2, re: R("mcclelland|need for achievement|nach\\b|need for affiliation|need for power|three[- ]needs"), tip: "Martina shows a high need for achievement that the standard menu now blocks." },
  { id: "xy", label: "Theory X / Theory Y", fam: "ct", pts: 1.5, re: R("theory x|theory y|mcgregor"), tip: "Constant monitoring and imposed targets reflect Theory X assumptions about staff." },
  { id: "erg", label: "Alderfer's ERG theory", fam: "ct", pts: 1.5, re: R("alderfer|\\berg\\b|existence,? relatedness|frustration[- ]regression"), tip: "Blocked growth needs can lead staff to focus on existence needs such as hours and pay (frustration-regression)." },
  { id: "intext", label: "Intrinsic vs extrinsic motivation", fam: "ct", pts: 1.5, re: R("intrinsic|extrinsic"), tip: "The voucher is an extrinsic reward; Martina's loss of creativity removes intrinsic motivation." },
  { id: "expectancy", label: "Expectancy theory (Vroom)", fam: "pt", pts: 3, re: R("expectancy|vroom|instrumentality|valence"), sub2: [R("expectancy"), R("instrumentality"), R("valence")], tip: "Most staff can't win the league (low expectancy), the link to reward is weak (instrumentality) and a voucher matters less than secure hours (valence)." },
  { id: "equity", label: "Equity theory / organisational justice", fam: "pt", pts: 3, re: R("equity|adams|inequit|referent|distributive justice|procedural justice|organi[sz]ational justice|fairness|unfair"), sub: R("referent|distributive|procedural|input|outcome|ratio|adams"), tip: "Aoife compares herself with the same winners on the busiest desk: low distributive and procedural justice." },
  { id: "goal", label: "Goal-setting theory", fam: "pt", pts: 3, re: R("goal[- ]setting|locke|smart goals?|goal acceptance|goal commitment|specific (and|&) (difficult|challenging) goals?|difficult goals?"), sub: R("accept|commit|particip|specific|difficult|feedback|smart"), tip: "The 16-room target was imposed: without participation, goal acceptance and commitment collapse." },
  { id: "jcm", label: "Job characteristics model", fam: "pt", pts: 3, re: R("job characteristics|hackman|oldham|\\bjcm\\b|skill variety|task identity|task significance|autonomy|job enrichment|job design|job redesign"), sub2: [R("skill variety|variety"), R("task identity"), R("task significance|significance"), R("autonomy"), R("feedback")], tip: "The standard menu strips Martina's autonomy, skill variety and task identity; feedback by email is impersonal." },
  { id: "reinf", label: "Reinforcement theory", fam: "pt", pts: 1.5, re: R("reinforcement|reinforc|punish|skinner|operant"), tip: "Supervisors only point out mistakes: punishment without positive reinforcement." },

  return L("Task A · Individual behaviour", ["Job satisfaction, commitment and engagement are <b>job attitudes</b>. The figures show their classic outcomes: absence up from 4 to 9 days, 38% early leavers and lower guest reviews.", "Tom shows the <b>fundamental attribution error</b>: he blames internal causes (attitude) and ignores situational ones (contracts, job design, management)."])
    + L("Task A · Content theories", ["<b>Maslow</b>: zero-hours contracts threaten safety needs.", "<b>Herzberg</b>: insecurity and impersonal supervision are hygiene problems; recognition, responsibility and the work itself (Martina's creativity) were motivators, and they have been removed.", "<b>McClelland</b>: Martina's need for achievement is blocked.", "Evaluate: Maslow's hierarchy has weak empirical support, and Herzberg's method is criticised."])
    + L("Task A · Process theories and job design", ["<b>Expectancy</b>: low expectancy (the league favours the busiest desks), weak instrumentality and low valence (a voucher vs secure hours).", "<b>Equity</b>: Aoife sees the same winners, so distributive and procedural justice are low.", "<b>Goal-setting</b>: the imposed 16-room target lacks participation, so acceptance and commitment are low.", "<b>Job characteristics model</b>: the standard menu removes Martina's autonomy, skill variety and task identity; email feedback is impersonal."])
    + L("Task A · Leadership and Tom's claim", ["Tom is <b>transactional</b> and production-oriented: high initiating structure, low consideration, and no vision.", "Supervisors give only corrective feedback, and trust (consistency, openness) has fallen.", "<b>Conclusion</b>: the claim is not supported. The collapse coincides with management changes, so the causes are organisational. Personality shapes individual reactions but can't explain a group-wide decline."])
    + L("Task B · A strong 12-month plan", ["Months 1-3: guaranteed minimum hours and rotas published in advance (hygiene factors, safety needs).", "Replace the league with team-based, transparent recognition and regular face-to-face praise (equity, reinforcement).", "Give Martina back menu autonomy within a group framework; agree workload standards with housekeepers (JCM, goal-setting participation).", "Develop supervisors in consideration and coaching (behavioural and transformational leadership); add staff forums and pulse surveys.", "Measure engagement, sick days, six-month turnover and guest reviews against the 2023 baseline; acknowledge the costs for the new owners."]);
}
function download() {
  const { r, f } = E.res, [, bname, bshort] = band(r.total);
  const p = (t) => `<p>${esc(t).replace(/\n/g, "<br>")}</p>`;
  const html = `<html><head><meta charset="utf-8"><title>Essay</title></head><body style="font-family:Calibri,Arial;font-size:11pt">
    <h1>Lighthouse Hotels Turnaround: practice essay</h1><p><b>Student:</b> ${esc(E.name)}<br><b>Submitted:</b> ${new Date(E.res.at).toLocaleString()}<br><b>Practice mark:</b> ${r.total}/100 (${bshort}, ${bname})<br><b>Score code:</b> ${markCode(r.total, r.wa + r.wb)}</p>
    <h2>Task A</h2>${p(E.a)}<h2>Task B</h2>${p(E.b)}
    <h2>Feedback</h2><p>Knowledge of theory: ${level(r.sc.know / 25)} · Application to the case: ${level(r.sc.app / 25)} · Critical evaluation: ${level(r.sc.ev / 20)} · Recommendations: ${level(r.sc.rec / 30)}</p>
    <p><b>Strengths</b></p><ul>${f.strengths.map((x) => `<li>${x}</li>`).join("")}</ul><p><b>To improve</b></p><ul>${f.gaps.map((x) => `<li>${x}</li>`).join("")}</ul><p><b>Next step:</b> ${f.next}</p></body></html>`;
  const blob = new Blob(["﻿" + html], { type: "application/msword" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Essay_${E.name.replace(/[^\w-]+/g, "_")}.doc`; document.body.appendChild(a); a.click(); a.remove();
}
// ============================================================ LECTURER: verify codes (#check) and reset (#reset)
function check() {
  view(`<div class="wrap"><div class="hero" style="margin-top:14px"><h1>Check essay codes</h1><p>Type a student's score code to confirm it's genuine.</p></div>
    <div class="card"><input id="cc" placeholder="E-67-512-KQ"><button class="btn block" style="margin-top:12px" onclick="verify()">Check</button><p id="cm" style="font-weight:700"></p></div></div>`);
}
function verify() { const m = $("#cc").value.trim().toUpperCase().match(/^E-(\d+)-(\d+)-([A-Z]{2})$/); const out = $("#cm"); if (!m) { out.textContent = "⚠️ That doesn't look like an essay code"; return; } if (checksum(`EE1|${+m[1]}|${+m[2]}|ESSAY`) !== m[3]) { out.textContent = "❌ Not a valid code"; return; } const [, bn, bs] = band(+m[1]); out.textContent = `✅ Valid: ${m[1]}/100 (${bs}, ${bn}) · ${m[2]} words`; }
function route() { const h = location.hash.replace("#", ""); if (h === "check") return check(); if (h === "reset") { if (confirm("Clear the essay saved on this device?")) { localStorage.removeItem(KEY); E = { name: "", started: 0, a: "", b: "", done: false, res: null }; } location.hash = ""; return start(); } start(); }
window.addEventListener("hashchange", route);
route();
</script>
